<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitStep Boost</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0b1120;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
    }
    .card {
      background: #1e293b;
      border-radius: 20px;
      width: 100%;
      max-width: 420px;
      padding: 26px 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      text-align: center;
    }
    h1 { font-size: 24px; font-weight: 700; margin-bottom: 6px; color: #38bdf8; }
    p.sub { font-size: 13px; color: #94a3b8; margin-bottom: 22px; }
    .user-box {
      background: #0f172a;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 18px;
      font-size: 13px;
      word-break: break-all;
    }
    .user-label { color: #94a3b8; font-size: 12px; margin-bottom: 4px; }
    .user-email { color: #38bdf8; font-weight: 600; font-size: 14px; margin-bottom: 10px; }
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 12px;
      transition: all 0.2s;
    }
    .btn-login { background: #0284c7; color: #fff; }
    .btn-ad { background: #0284c7; color: #fff; }
    .btn-sync { background: #1e3a5f; color: #64748b; }
    .btn-sync.active { background: #16a34a; color: #fff; }
    .btn-logout { background: #ef4444; color: #fff; padding: 7px 18px; font-size: 12px; border-radius: 8px; width: auto; }
    .btn:disabled { background: #1e293b; border: 1px solid #334155; color: #475569; cursor: not-allowed; }
    .ad-counter-text { font-size: 13px; color: #38bdf8; margin-bottom: 16px; font-weight: 500; }
    .status-text {
      background: #0f172a;
      border-radius: 12px;
      padding: 14px;
      font-size: 12px;
      color: #94a3b8;
      text-align: left;
      line-height: 1.7;
      margin-top: 14px;
      max-height: 170px;
      overflow-y: auto;
    }
    .status-text b { color: #38bdf8; }
    .done-banner {
      background: #14532d;
      border: 1px solid #22c55e;
      color: #86efac;
      padding: 12px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 14px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>FitStep Boost</h1>
    <p class="sub">Google Fit स्टेप्स ऑटोमेशन (सुरक्षित सिंक टूल)</p>

    <div id="loginSection">
      <button id="loginBtn" class="btn btn-login" onclick="login()">Google Fit से लॉगिन करें</button>
    </div>

    <div id="appSection" style="display: none;">
      <div class="user-box">
        <div class="user-label">लॉगिन अकाउंट</div>
        <div id="userEmailText" class="user-email"></div>
        <button class="btn btn-logout" onclick="logout()">साइन आउट (लॉगआउट)</button>
      </div>

      <div id="doneBanner" class="done-banner">
        ✅ <b>आज का कोटा पूरा हुआ!</b><br>आप आज के स्टेप्स सिंक कर चुके हैं। अगला मौका आज रात 12:00 बजे (Midnight) के बाद मिलेगा।
      </div>

      <button id="adBtn" class="btn btn-ad" onclick="playAd()" disabled>ऐड्स देखें और सिंक शुरू करें (0/5)</button>
      <div id="adCounter" class="ad-counter-text">देखे गए ऐड्स: 0 / 5</div>
      <button id="syncBtn" class="btn btn-sync" onclick="syncSteps()" disabled>स्टेप्स सिंक करें</button>
    </div>

    <div id="statusBox" class="status-text">तैयार... कृपया लॉगिन करें।</div>
  </div>

  <script>
    const APP_VERSION = "1.0";
    const CLIENT_ID = "198753021000-di6e8eklooh5bbo34f002b5c3b1a3958.apps.googleusercontent.com";
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx0af3er7Y8i5yNBBUdKfaos15Z9METmiYl05acKw3cPeUE2j7nHkN02m-dPxXYm_1_/exec";

    let tokenClient;
    let accessToken = localStorage.getItem("fitstep_token") || null;
    let userEmail = localStorage.getItem("fitstep_email") || "";
    let adsWatched = 0;
    const requiredAds = 5;

    function addLog(msg) {
      const box = document.getElementById("statusBox");
      box.innerHTML += "<br>" + msg;
      box.scrollTop = box.scrollHeight;
    }

    function getTodayKey() {
      const d = new Date();
      return "sync_done_" + userEmail + "_" + d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
    }

    function isAlreadySyncedToday() {
      return localStorage.getItem(getTodayKey()) === "true";
    }

    window.onload = function() {
      initOAuth();
    };

    function initOAuth() {
      if (window.google && google.accounts && google.accounts.oauth2) {
        tokenClient = google.accounts.oauth2.initTokenClient({
          client_id: CLIENT_ID,
          scope: "https://www.googleapis.com/auth/fitness.activity.write https://www.googleapis.com/auth/userinfo.email openid",
          callback: (tokenResponse) => {
            if (tokenResponse && tokenResponse.access_token) {
              accessToken = tokenResponse.access_token;
              localStorage.setItem("fitstep_token", accessToken);
              fetchEmail();
            } else {
              addLog("लॉगिन अनुमति निरस्त की गई।");
            }
          }
        });

        // Agar pehle se login save hai toh auto-open karo
        if (userEmail && accessToken) {
          document.getElementById("userEmailText").innerText = userEmail;
          document.getElementById("loginSection").style.display = "none";
          document.getElementById("appSection").style.display = "block";
          addLog("अकाउंट लोड हुआ: <b>" + userEmail + "</b>");
          checkDailyStatusAndProceed();
        }
      } else {
        setTimeout(initOAuth, 400);
      }
    }

    function login() {
      if (!tokenClient) {
        initOAuth();
      }
      addLog("Google लॉगिन विंडो खोली जा रही है...");
      tokenClient.requestAccessToken({ prompt: "consent" });
    }

    function logout() {
      localStorage.removeItem("fitstep_token");
      localStorage.removeItem("fitstep_email");
      accessToken = null;
      userEmail = "";
      adsWatched = 0;
      document.getElementById("loginSection").style.display = "block";
      document.getElementById("appSection").style.display = "none";
      document.getElementById("statusBox").innerHTML = "लॉगआउट हो गया। कृपया दोबारा लॉगिन करें।";
    }

    function fetchEmail() {
      addLog("यूज़र प्रोफाइल लोड हो रही है...");
      fetch("https://www.googleapis.com/oauth2/v2/userinfo", {
        headers: { Authorization: "Bearer " + accessToken }
      })
      .then(r => r.json())
      .then(info => {
        userEmail = info.email;
        localStorage.setItem("fitstep_email", userEmail);
        document.getElementById("userEmailText").innerText = userEmail;
        document.getElementById("loginSection").style.display = "none";
        document.getElementById("appSection").style.display = "block";
        addLog("लॉगिन सफल: <b>" + userEmail + "</b>");
        checkDailyStatusAndProceed();
      })
      .catch(e => {
        addLog("ईमेल प्राप्त करने में समस्या। कृपया दोबारा लॉगिन करें।");
      });
    }

    function checkDailyStatusAndProceed() {
      if (isAlreadySyncedToday()) {
        document.getElementById("doneBanner").style.display = "block";
        document.getElementById("adBtn").disabled = true;
        document.getElementById("syncBtn").disabled = true;
        document.getElementById("adCounter").style.display = "none";
        addLog("ℹ️ आज के स्टेप्स पहले ही सिंक हो चुके हैं। अगला सिंक आज रात 12:00 बजे के बाद उपलब्ध होगा।");
      } else {
        document.getElementById("doneBanner").style.display = "none";
        document.getElementById("adCounter").style.display = "block";
        verifyWhitelist(userEmail);
      }
    }

    function verifyWhitelist(email) {
      addLog("एडमिन अनुमति (Whitelist) व ऐप वर्ज़न चेक की जा रही है...");
      const callbackName = "jsonp_cb_" + Math.round(Math.random() * 100000);
      window[callbackName] = function(data) {
        delete window[callbackName];
        if (script.parentNode) script.parentNode.removeChild(script);

        if (data.allowed) {
          addLog("✅ अनुमति स्वीकृत (Approved): आप सिंक कर सकते हैं।");
          document.getElementById("adBtn").disabled = false;
        } else if (data.status === "OUTDATED_VERSION") {
          addLog("❌ <b>ऐप वर्ज़न पुराना है:</b> नया वर्ज़न उपलब्ध है।");
          alert("आपका ऐप वर्ज़न पुराना हो चुका है! कृपया एडमिन से नया APK लेकर अपडेट करें।");
        } else {
          addLog("⏳ अनुमति लंबित (Pending): एडमिन की मंज़ूरी का इंतज़ार करें।");
        }
      };

      const script = document.createElement("script");
      script.src = SCRIPT_URL + "?email=" + encodeURIComponent(email) + "&version=" + APP_VERSION + "&callback=" + callbackName;
      document.body.appendChild(script);
    }

    function playAd() {
      if (isAlreadySyncedToday()) {
        alert("आज का सिंक कोटा पूरा हो चुका है। कृपया रात 12:00 बजे के बाद प्रयास करें।");
        return;
      }
      if (window.AndroidBridge && window.AndroidBridge.showRewardedAd) {
        window.AndroidBridge.showRewardedAd();
      } else {
        alert("मोबाइल ऐप ब्रिज कनेक्ट नहीं हुआ।");
      }
    }

    window.adRewardCompleted = function() {
      adsWatched++;
      document.getElementById("adBtn").innerText = "ऐड्स देखें और सिंक शुरू करें (" + adsWatched + "/5)";
      document.getElementById("adCounter").innerText = "देखे गए ऐड्स: " + adsWatched + " / " + requiredAds;
      addLog("ऐड सफलतापूर्वक देखा गया (" + adsWatched + "/" + requiredAds + ")");

      if (adsWatched >=
