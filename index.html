<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitStep Boost</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; padding: 24px 16px; background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    .card { background: #1e293b; border-radius: 16px; padding: 24px; width: 100%; max-width: 420px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); text-align: center; }
    h1 { font-size: 24px; margin-bottom: 8px; color: #38bdf8; }
    p { font-size: 14px; color: #94a3b8; line-height: 1.5; }
    .btn { background: #0284c7; color: white; border: none; padding: 14px 20px; border-radius: 10px; font-size: 16px; font-weight: 600; width: 100%; cursor: pointer; margin-top: 16px; transition: background 0.2s; }
    .btn:hover { background: #0369a1; }
    .btn:disabled { background: #475569; cursor: not-allowed; }
    .status-box { margin-top: 20px; background: #0f172a; border-radius: 10px; padding: 16px; text-align: left; font-size: 13px; color: #cbd5e1; min-height: 140px; max-height: 220px; overflow-y: auto; white-space: pre-wrap; word-break: break-all; }
    .counter { font-size: 15px; font-weight: 600; color: #38bdf8; margin-top: 14px; }
  </style>
</head>
<body>

  <div class="card">
    <h1>FitStep Boost</h1>
    <p>Google Fit स्टेप्स ऑटोमेशन और सिंक टूल</p>

    <div id="authSection">
      <button class="btn" id="loginBtn" onclick="requestToken()">Google Fit से कनेक्ट करें</button>
    </div>

    <div id="appSection" style="display: none;">
      <p id="userInfo" style="color: #4ade80; font-weight: 500;"></p>
      
      <button class="btn" id="syncBtn" onclick="startSyncProcess()">ऐड्स देखें और सिंक शुरू करें (0/5)</button>
      <div class="counter" id="adCounter">देखे गए ऐड्स: 0 / 5</div>
    </div>

    <div class="status-box" id="statusLog">तैयार... कृपया लॉगिन करें।</div>
  </div>

  <script>
    const CLIENT_ID = "198753021000-di6e8eklooh5bbo34f002b5c3b1a3958.apps.googleusercontent.com";
    const SCOPES = "https://www.googleapis.com/auth/fitness.activity.write";
    
    let tokenClient;
    let accessToken = localStorage.getItem("fit_token") || null;
    let adsWatched = 0;

    function log(msg) {
      const box = document.getElementById("statusLog");
      box.textContent += "\n" + msg;
      box.scrollTop = box.scrollHeight;
    }

    window.onload = function() {
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: SCOPES,
        callback: (resp) => {
          if (resp.error) {
            log("लॉगिन त्रुटि: " + resp.error);
            return;
          }
          accessToken = resp.access_token;
          localStorage.setItem("fit_token", accessToken);
          onLoginSuccess();
        },
      });

      if (accessToken) {
        onLoginSuccess();
      }
    };

    function requestToken() {
      tokenClient.requestAccessToken({ prompt: "" });
    }

    function onLoginSuccess() {
      document.getElementById("authSection").style.display = "none";
      document.getElementById("appSection").style.display = "block";
      document.getElementById("userInfo").innerText = "अकाउंट सफलतापूर्वक लिंक हो गया!";
      log("सफलतापूर्वक कनेक्ट हो गया। सिंक करने के लिए तैयार।");
    }

    function startSyncProcess() {
      if (window.AndroidBridge && window.AndroidBridge.showRewardedAd) {
        window.AndroidBridge.showRewardedAd();
      } else {
        adRewardCompleted();
      }
    }

    function adRewardCompleted() {
      adsWatched++;
      document.getElementById("adCounter").innerText = `देखे गए ऐड्स: ${adsWatched} / 5`;
      document.getElementById("syncBtn").innerText = `ऐड्स देखें और सिंक शुरू करें (${adsWatched}/5)`;
      log(`ऐड ${adsWatched}/5 पूरा देखा गया।`);

      if (adsWatched >= 5) {
        document.getElementById("syncBtn").disabled = true;
        log("5 ऐड्स पूरे हुए! बैकग्राउंड स्टेप्स सिंक शुरू हो रहा है...");
        runStepInjection();
      }
    }

    async function getValidDataSource() {
      const listRes = await fetch("https://www.googleapis.com/fitness/v1/users/me/dataSources?dataTypeName=com.google.step_count.delta", {
        headers: { "Authorization": `Bearer ${accessToken}` }
      });

      if (listRes.ok) {
        const listData = await listRes.json();
        if (listData.dataSource && listData.dataSource.length > 0) {
          return listData.dataSource[0].dataStreamId;
        }
      }

      const createRes = await fetch("https://www.googleapis.com/fitness/v1/users/me/dataSources", {
        method: "POST",
        headers: {
          "Authorization": `Bearer ${accessToken}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          "dataStreamName": "DefaultStepCounter",
          "type": "raw",
          "application": { "name": "FitStepBoost" },
          "dataType": {
            "name": "com.google.step_count.delta",
            "field": [{ "name": "steps", "format": "integer" }]
          }
        })
      });

      const createData = await createRes.json();
      return createData.dataStreamId;
    }

    async function runStepInjection() {
      try {
        log("डेटासोर्स कनेक्ट किया जा रहा है...");
        const dataSourceId = await getValidDataSource();

        // 11,000 से 13,000 के बीच कुल स्टेप्स
        const targetTotalSteps = Math.floor(Math.random() * (13000 - 11000 + 1)) + 11000;
        
        // 1 मिनट में औसतन 98-102 स्टेप्स की गति के अनुसार कुल मिनट तय करना (लगभग 110 से 125 मिनट)
        const totalMinutes = Math.floor(targetTotalSteps / 100); 

        const nowMs = Date.now();
        const startSessionMs = nowMs - (totalMinutes * 60 * 1000);

        let points = [];
        let accumulatedSteps = 0;

        for (let i = 0; i < totalMinutes; i++) {
          const mStartMs = startSessionMs + (i * 60 * 1000);
          const mEndMs = mStartMs + (60 * 1000);

          // हर 1 मिनट में 92 से 108 के बीच रैंडम नेचुरल स्टेप्स
          let minuteSteps = Math.floor(Math.random() * (108 - 92 + 1)) + 92;

          // आख़िरी मिनट में बाकी बचे स्टेप्स को एडजस्ट करें
          if (i === totalMinutes - 1) {
            minuteSteps = targetTotalSteps - accumulatedSteps;
          }
          accumulatedSteps += minuteSteps;

          const pStartNanos = (BigInt(mStartMs) * 1000000n).toString();
          const pEndNanos = (BigInt(mEndMs) * 1000000n).toString();

          points.push({
            "startTimeNanos": pStartNanos,
            "endTimeNanos": pEndNanos,
            "dataTypeName": "com.google.step_count.delta",
            "value": [{ "intVal": minuteSteps }]
          });
        }

        const totalStartNanos = (BigInt(startSessionMs) * 1000000n).toString();
        const totalEndNanos = (BigInt(nowMs) * 1000000n).toString();

        log(`सत्र अवधि: पिछले ${totalMinutes} मिनट में विभाजित।`);
        log(`औसत गति: ~100 स्टेप्स/मिनट (स्वाभाविक चाल)`);
        log(`कुल सिंक होने वाले स्टेप्स: ${accumulatedSteps}`);

        const requestBody = {
          "dataSourceId": dataSourceId,
          "minStartTimeNs": totalStartNanos,
          "maxEndTimeNs": totalEndNanos,
          "point": points
        };

        const datasetId = `${totalStartNanos}-${totalEndNanos}`;
        const apiUrl = `https://www.googleapis.com/fitness/v1/users/me/dataSources/${encodeURIComponent(dataSourceId)}/datasets/${datasetId}`;

        const res = await fetch(apiUrl, {
          method: "PATCH",
          headers: {
            "Authorization": `Bearer ${accessToken}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify(requestBody)
        });

        if (res.ok) {
          log(`\n🎉 सफलता! ${accumulatedSteps} स्टेप्स पिछले ${totalMinutes} मिनटों में मिनट-दर-मिनट स्वाभाविक रूप से सिंक हो चुके हैं।`);
        } else {
          const err = await res.json();
          log("सिंक त्रुटि: " + JSON.stringify(err));
        }
      } catch (e) {
        log("त्रुटि: " + e.message);
      }
    }
  </script>
</body>
</html>
