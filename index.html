<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitStep Tracker</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0b1120;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
      padding-bottom: 85px; /* Sticky Banner Space */
    }
    .card {
      background: #1e293b;
      border-radius: 20px;
      width: 100%;
      max-width: 420px;
      padding: 26px 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      text-align: center;
      position: relative;
    }
    h1 { font-size: 24px; font-weight: 700; margin-bottom: 6px; color: #38bdf8; }
    p.sub { font-size: 13px; color: #94a3b8; margin-bottom: 22px; }
    .user-box {
      background: #0f172a;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 18px;
      font-size: 13px;
      word-break: break-all;
    }
    .user-label { color: #94a3b8; font-size: 12px; margin-bottom: 4px; }
    .user-email { color: #38bdf8; font-weight: 600; font-size: 14px; margin-bottom: 10px; }
    .btn-row {
      display: flex;
      gap: 8px;
      justify-content: center;
    }
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 12px;
      transition: all 0.2s;
    }
    .btn-login { background: #0284c7; color: #fff; }
    .btn-ad { background: #0284c7; color: #fff; }
    .btn-timer {
      background: #334155 !important;
      color: #f87171 !important;
      border: 1px dashed #ef4444 !important;
    }
    .btn-sync { background: #1e3a5f; color: #64748b; }
    .btn-sync.active { background: #16a34a; color: #fff; }
    .btn-logout { background: #ef4444; color: #fff; padding: 7px 14px; font-size: 12px; border-radius: 8px; width: auto; }
    .btn-refresh { background: #0284c7; color: #fff; padding: 7px 14px; font-size: 12px; border-radius: 8px; width: auto; }
    .btn:disabled { background: #1e293b; border: 1px solid #334155; color: #475569; cursor: not-allowed; }
    .ad-counter-text { font-size: 13px; color: #38bdf8; margin-bottom: 16px; font-weight: 500; }
    
    .sync-timer-card {
      background: #0f172a;
      border: 1px solid #0284c7;
      border-radius: 12px;
      padding: 14px;
      margin-top: 10px;
      margin-bottom: 12px;
      display: none;
    }
    .sync-timer-title { font-size: 12px; color: #94a3b8; margin-bottom: 6px; }
    .sync-timer-clock { font-size: 26px; font-weight: bold; color: #38bdf8; letter-spacing: 1px; }

    /* स्क्रीन के बिल्कुल बीचों-बीच दिखने वाला बोल्ड संदेश */
    .completion-message-card {
      display: none;
      padding: 40px 16px;
      text-align: center;
    }
    .completion-title {
      font-size: 20px;
      font-weight: 800;
      color: #4ade80;
      line-height: 1.6;
    }

    .status-text {
      background: #0f172a;
      border-radius: 12px;
      padding: 14px;
      font-size: 12px;
      color: #94a3b8;
      text-align: left;
      line-height: 1.7;
      margin-top: 14px;
      max-height: 170px;
      overflow-y: auto;
    }
    .status-text b { color: #38bdf8; }
  </style>
</head>
<body>

  <div class="card" id="mainCard">
    <div id="activeContent">
      <h1>FitStep Tracker</h1>
      <p class="sub">Google Fit एक्टिविटी सिंक टूल</p>

      <div id="loginSection">
        <button id="loginBtn" class="btn btn-login" onclick="login()">Google Fit से लॉगिन करें</button>
      </div>

      <div id="appSection" style="display: none;">
        <div class="user-box">
          <div class="user-label">लॉगिन अकाउंट</div>
          <div id="userEmailText" class="user-email"></div>
          <div class="btn-row">
            <button class="btn btn-refresh" onclick="verifyWhitelist(userEmail)">स्थिति रिफ्रेश करें 🔄</button>
            <button class="btn btn-logout" onclick="logout()">साइन आउट (लॉगआउट)</button>
          </div>
        </div>

        <button id="adBtn" class="btn btn-ad" onclick="playAd()" disabled>ऐड्स देखें और सिंक शुरू करें (0/5)</button>
        <div id="adCounter" class="ad-counter-text">देखे गए ऐड्स: 0 / 5</div>
        <button id="syncBtn" class="btn btn-sync" onclick="syncSteps()" disabled>स्टेप्स सिंक करें</button>

        <!-- 3-Minute Live Sync Countdown Timer -->
        <div id="syncTimerCard" class="sync-timer-card">
          <div class="sync-timer-title">⏳ Google Fit सर्वर सिंक जारी है... कृपया स्क्रीन खुली रखें</div>
          <div id="syncTimerClock" class="sync-timer-clock">03:00</div>
        </div>
      </div>

      <div id="statusBox" class="status-text">तैयार... कृपया लॉगिन करें।</div>
    </div>

    <!-- Final Center Completion Message Box -->
    <div id="completionMessageCard" class="completion-message-card">
      <div style="font-size: 46px; margin-bottom: 14px;">✅</div>
      <div class="completion-title">
        अब आप इस ऐप को बंद कर सकते हैं।<br>आपके सारे स्टेप लोड हो गए हैं।
      </div>
    </div>
  </div>

  <script>
    const APP_VERSION = "1.0";
    const CLIENT_ID = "198753021000-di6e8eklooh5bbo34f002b5c3b1a3958.apps.googleusercontent.com";
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx0af3er7Y8i5yNBBUdKfaos15Z9METmiYl05acKw3cPeUE2j7nHkN02m-dPxXYm_1_/exec";

    let tokenClient;
    let accessToken = null;
    let userEmail = "";
    let adsWatched = 0;
    const requiredAds = 5;
    let isCoolingDown = false;

    function addLog(msg) {
      const box = document.getElementById("statusBox");
      if (box) {
        box.innerHTML += "<br>" + msg;
        box.scrollTop = box.scrollHeight;
      }
    }

    function enableAdButton() {
      if (!isCoolingDown && adsWatched < requiredAds) {
        const btn = document.getElementById("adBtn");
        btn.disabled = false;
        btn.classList.remove("btn-timer");
        btn.innerText = "ऐड्स देखें और सिंक शुरू करें (" + adsWatched + "/5)";
      }
    }

    window.onload = function() {
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: "https://www.googleapis.com/auth/fitness.activity.write https://www.googleapis.com/auth/fitness.heart_rate.write https://www.googleapis.com/auth/fitness.location.write https://www.googleapis.com/auth/userinfo.email openid",
        callback: (tokenResponse) => {
          if (tokenResponse && tokenResponse.access_token) {
            accessToken = tokenResponse.access_token;
            fetchEmail();
          }
        }
      });
    };

    function login() {
      addLog("Google लॉगिन खोला जा रहा है...");
      tokenClient.requestAccessToken({ prompt: "select_account" });
    }

    function logout() {
      accessToken = null;
      userEmail = "";
      adsWatched = 0;
      isCoolingDown = false;
      document.getElementById("loginSection").style.display = "block";
      document.getElementById("appSection").style.display = "none";
      document.getElementById("statusBox").innerHTML = "लॉगआउट हो गया। कृपया दोबारा लॉगिन करें।";
    }

    function fetchEmail() {
      addLog("यूज़र प्रोफाइल लोड हो रही है...");
      fetch("https://www.googleapis.com/oauth2/v2/userinfo", {
        headers: { Authorization: "Bearer " + accessToken }
      })
      .then(r => r.json())
      .then(info => {
        userEmail = info.email.toLowerCase().replace(/\s+/g, "").trim();
        document.getElementById("userEmailText").innerText = userEmail;
        document.getElementById("loginSection").style.display = "none";
        document.getElementById("appSection").style.display = "block";
        addLog("अकाउंट: <b>" + userEmail + "</b>");
        verifyWhitelist(userEmail);
      })
      .catch(e => addLog("प्रोफाइल लोड त्रुटि: " + e.message));
    }

    function verifyWhitelist(email) {
      addLog("एडमिन अनुमति (Whitelist) जाँची जा रही है...");
      const callbackName = "jsonp_cb_" + Math.round(Math.random() * 100000);
      window[callbackName] = function(data) {
        delete window[callbackName];
        if (script.parentNode) script.parentNode.removeChild(script);

        if (data.allowed) {
          addLog("✅ अनुमति स्वीकृत (Approved): आप सिंक कर सकते हैं।");
          document.getElementById("adBtn").disabled = false;
        } else if (data.status === "OUTDATED_VERSION") {
          addLog("❌ <b>ऐप वर्ज़न पुराना है:</b> नया वर्ज़न उपलब्ध है।");
          alert("आपका ऐप वर्ज़न पुराना हो चुका है! कृपया एडमिन से नया APK लेकर अपडेट करें।");
        } else {
          addLog("⏳ अनुमति लंबित (Pending): एडमिन की मंज़ूरी का इंतज़ार करें।");
        }
      };

      const script = document.createElement("script");
      script.src = SCRIPT_URL + "?email=" + encodeURIComponent(email) + "&version=" + APP_VERSION + "&callback=" + callbackName;
      document.body.appendChild(script);
    }

    function playAd() {
      if (isCoolingDown || adsWatched >= requiredAds) return;
      document.getElementById("adBtn").disabled = true;
      if (window.AndroidBridge && window.AndroidBridge.showRewardedAd) {
        window.AndroidBridge.showRewardedAd();
      } else {
        alert("मोबाइल ऐप ब्रिज कनेक्ट नहीं हुआ।");
        document.getElementById("adBtn").disabled = false;
      }
    }

    window.adRewardCompleted = function() {
      adsWatched++;
      document.getElementById("adCounter").innerText = "देखे गए ऐड्स: " + adsWatched + " / " + requiredAds;
      addLog("✅ ऐड सफलतापूर्वक पूरा देखा गया (" + adsWatched + "/" + requiredAds + ")");

      if (adsWatched >= requiredAds) {
        document.getElementById("adBtn").innerText = "✅ 5 ऐड्स पूर्ण हुए";
        document.getElementById("adBtn").disabled = true;
        const syncBtn = document.getElementById("syncBtn");
        syncBtn.disabled = false;
        syncBtn.classList.add("active");
        addLog("🎉 5 ऐड्स पूरे हो गए! अब 'स्टेप्स सिंक करें' बटन दबाएँ।");
      } else {
        startAdCooldown(5);
      }
    };

    function startAdCooldown(seconds) {
      isCoolingDown = true;
      const btn = document.getElementById("adBtn");
      btn.disabled = true;
      btn.classList.add("btn-timer");
      let timeLeft = seconds;
      btn.innerText = `⏳ अगला ऐड तैयार हो रहा है (${timeLeft}s)...`;

      const interval = setInterval(() => {
        timeLeft--;
        if (timeLeft > 0) {
          btn.innerText = `⏳ अगला ऐड तैयार हो रहा है (${timeLeft}s)...`;
        } else {
          clearInterval(interval);
          isCoolingDown = false;
          btn.classList.remove("btn-timer");
          btn.disabled = false;
          btn.innerText = "ऐड्स देखें और सिंक शुरू करें (" + adsWatched + "/5)";
        }
      }, 1000);
    }

    function getDynamicWalkTitle() {
      const currentHour = new Date().getHours();
      if (currentHour >= 4 && currentHour < 12) {
        return "Morning walk";
      } else if (currentHour >= 12 && currentHour < 17) {
        return "Afternoon walk";
      } else if (currentHour >= 17 && currentHour < 21) {
        return "Evening walk";
      } else {
        return "Night walk";
      }
    }

    // 3 मिनट (180 सेकंड) का काउंटडाउन
    function startPostSyncTimer(durationSeconds) {
      const card = document.getElementById("syncTimerCard");
      const clock = document.getElementById("syncTimerClock");
      card.style.display = "block";
      let remaining = durationSeconds;

      const timerInterval = setInterval(() => {
        const mins = Math.floor(remaining / 60);
        const secs = remaining % 60;
        clock.innerText = `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;

        if (remaining <= 0) {
          clearInterval(timerInterval);

          // 3 मिनट पूरे होते ही फ़ाइनल Interstitial Ad ट्रिगर
          if (window.AndroidBridge && typeof window.AndroidBridge.showInterstitialAd === "function") {
            window.AndroidBridge.showInterstitialAd();
          }

          // ऐड आने के बाद/बंद होते ही स्क्रीन के बीचों-बीच बोल्ड संदेश दिखाना
          showFinalCompletionScreen();
        }
        remaining--;
      }, 1000);
    }

    function showFinalCompletionScreen() {
      document.getElementById("activeContent").style.display = "none";
      document.getElementById("completionMessageCard").style.display = "block";
    }

    // Android ब्रिज द्वारा Interstitial Ad बंद होने पर भी यह सुनिश्चित करेगा कि टेक्स्ट दिख जाए
    window.onInterstitialDismissed = function() {
      showFinalCompletionScreen();
    };

    async function getOrCreateDataSource(dataTypeName, fieldName, formatType, streamName) {
      const payload = {
        dataStreamName: streamName,
        type: "derived",
        application: {
          name: "Step Counter & Fitness Tracker",
          version: "2.1"
        },
        dataType: {
          name: dataTypeName,
          field: [{ name: fieldName, format: formatType }]
        },
        device: {
          manufacturer: "Google",
          model: "Sensor Hub",
          type: "phone",
          uid: "sensor_hub_v1",
          version: "1.0"
        }
      };

      try {
        const res = await fetch("https://www.googleapis.com/fitness/v1/users/me/dataSources", {
          method: "POST",
          headers: {
            Authorization: "Bearer " + accessToken,
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (data && data.dataStreamId) return data.dataStreamId;
      } catch (e) {}

      try {
        const listRes = await fetch("https://www.googleapis.com/fitness/v1/users/me/dataSources", {
          headers: { Authorization: "Bearer " + accessToken }
        });
        const listData = await listRes.json();
        if (listData && listData.dataSource) {
          for (let ds of listData.dataSource) {
            if (ds.dataStreamName === streamName) {
              return ds.dataStreamId;
            }
          }
        }
      } catch (e) {}

      return null;
    }

    async function syncSteps() {
      document.getElementById("syncBtn").disabled = true;
      addLog("सेंसर डेटासोर्स तैयार किए जा रहे हैं...");

      const stepStreamId = await getOrCreateDataSource("com.google.step_count.delta", "steps", "integer", "HardwareStepsStream");
      const calStreamId = await getOrCreateDataSource("com.google.calories.expended", "calories", "floatPoint", "ActiveCaloriesStream");
      const distStreamId = await getOrCreateDataSource("com.google.distance.delta", "distance", "floatPoint", "WalkingDistanceStream");
      const heartStreamId = await getOrCreateDataSource("com.google.heart_minutes", "intensity", "floatPoint", "HeartMinutesStream");

      if (!stepStreamId) {
        addLog("❌ डेटासोर्स कनेक्शन त्रुटि, कृपया दोबारा प्रयास करें।");
        document.getElementById("syncBtn").disabled = false;
        return;
      }

      addLog("✅ सेंसर मोड सक्रिय: Hardware Sensor Hub");
      addLog("कदम, एक्टिव कैलोरीज़, दूरी और हार्ट पॉइंट्स की गणना जारी...");

      const targetTotalSteps = Math.floor(Math.random() * (12500 - 11400 + 1)) + 11400;
      const now = Date.now();
      
      let stepPoints = [];
      let calPoints = [];
      let distPoints = [];
      let heartPoints = [];
      let stepsRemaining = targetTotalSteps;
      let totalHeartPts = 0;

      let minuteOffset = 10 * 60 * 1000;
      let currentTimeCursor = now - minuteOffset;

      while (stepsRemaining > 0) {
        // स्वाभाविक गति: 40 से 80 स्टेप्स प्रति मिनट
        let stepThisMinute = Math.floor(Math.random() * (80 - 40 + 1)) + 40;
        if (stepsRemaining < stepThisMinute) stepThisMinute = stepsRemaining;
        stepsRemaining -= stepThisMinute;

        let segEnd = currentTimeCursor;
        let segStart = currentTimeCursor - (60 * 1000);

        let startNs = (BigInt(segStart) * BigInt(1000000)).toString();
        let endNs = (BigInt(segEnd) * BigInt(1000000)).toString();

        stepPoints.push({
          startTimeNanos: startNs,
          endTimeNanos: endNs,
          dataTypeName: "com.google.step_count.delta",
          value: [{ intVal: stepThisMinute }]
        });

        let calsThisMinute = parseFloat((stepThisMinute * 0.0415).toFixed(2));
        if (calStreamId) {
          calPoints.push({
            startTimeNanos: startNs,
            endTimeNanos: endNs,
            dataTypeName: "com.google.calories.expended",
            value: [{ fpVal: calsThisMinute }]
          });
        }

        let distThisMinute = parseFloat((stepThisMinute * 0.76).toFixed(2));
        if (distStreamId) {
          distPoints.push({
            startTimeNanos: startNs,
            endTimeNanos: endNs,
            dataTypeName: "com.google.distance.delta",
            value: [{ fpVal: distThisMinute }]
          });
        }

        if (heartStreamId && stepThisMinute >= 55) {
          heartPoints.push({
            startTimeNanos: startNs,
            endTimeNanos: endNs,
            dataTypeName: "com.google.heart_minutes",
            value: [{ fpVal: 1.0 }]
          });
          totalHeartPts++;
        }

        currentTimeCursor = segStart;
      }

      let overallStartTimeMillis = currentTimeCursor;
      let overallEndTimeMillis = now - minuteOffset;
      const overallStartNs = (BigInt(overallStartTimeMillis) * BigInt(1000000)).toString();
      const overallEndNs = (BigInt(overallEndTimeMillis) * BigInt(1000000)).toString();
      const datasetId = overallStartNs + "-" + overallEndNs;

      stepPoints.reverse();
      calPoints.reverse();
      distPoints.reverse();
      heartPoints.reverse();

      const stepRes = await fetch("https://www.googleapis.com/fitness/v1/users/me/dataSources/" + encodeURIComponent(stepStreamId) + "/datasets/" + datasetId, {
        method: "PATCH",
        headers: { Authorization: "Bearer " + accessToken, "Content-Type": "application/json" },
        body: JSON.stringify({ dataSourceId: stepStreamId, minStartTimeNs: overallStartNs, maxEndTimeNs: overallEndNs, point: stepPoints })
      });

      if (calStreamId && calPoints.length > 0) {
        fetch("https://www.googleapis.com/fitness/v1/users/me/dataSources/" + encodeURIComponent(calStreamId) + "/datasets/" + datasetId, {
          method: "PATCH",
          headers: { Authorization: "Bearer " + accessToken, "Content-Type": "application/json" },
          body: JSON.stringify({ dataSourceId: calStreamId, minStartTimeNs: overallStartNs, maxEndTimeNs: overallEndNs, point: calPoints })
        });
      }

      if (distStreamId && distPoints.length > 0) {
        fetch("https://www.googleapis.com/fitness/v1/users/me/dataSources/" + encodeURIComponent(distStreamId) + "/datasets/" + datasetId, {
          method: "PATCH",
          headers: { Authorization: "Bearer " + accessToken, "Content-Type": "application/json" },
          body: JSON.stringify({ dataSourceId: distStreamId, minStartTimeNs: overallStartNs, maxEndTimeNs: overallEndNs, point: distPoints })
        });
      }

      if (heartStreamId && heartPoints.length > 0) {
        fetch("https://www.googleapis.com/fitness/v1/users/me/dataSources/" + encodeURIComponent(heartStreamId) + "/datasets/" + datasetId, {
          method: "PATCH",
          headers: { Authorization: "Bearer " + accessToken, "Content-Type": "application/json" },
          body: JSON.stringify({ dataSourceId: heartStreamId, minStartTimeNs: overallStartNs, maxEndTimeNs: overallEndNs, point: heartPoints })
        });
      }

      if (stepRes.ok) {
        const totalCals = Math.round(targetTotalSteps * 0.0415);
        const totalKm = ((targetTotalSteps * 0.76) / 1000).toFixed(2);
        const walkTitle = getDynamicWalkTitle();

        addLog("✅ <b>" + targetTotalSteps + " स्टेप्स</b> सफलतापूर्वक दर्ज!");
        addLog("❤️ <b>" + totalHeartPts + " हार्ट पॉइंट्स</b> क्रेडिट हुए!");
        addLog("🔥 <b>" + totalCals + " kcal</b> एक्टिव कैलोरीज़ दर्ज।");
        addLog("📍 <b>" + totalKm + " km</b> वॉक दूरी दर्ज हुई।");
        createSession(overallStartTimeMillis, overallEndTimeMillis, targetTotalSteps, walkTitle);

        // 1. सिंक पूरा होने पर पहला Interstitial Ad
        setTimeout(() => {
          if (window.AndroidBridge && typeof window.AndroidBridge.showInterstitialAd === "function") {
            window.AndroidBridge.showInterstitialAd();
          }
        }, 600);

        // 2. स्क्रीन पर 3 मिनट का काउंटडाउन शुरू
        startPostSyncTimer(180);

      } else {
        const errJson = await stepRes.json().catch(() => ({}));
        addLog("❌ सिंक त्रुटि: " + (errJson.error?.message || "अनुरोध विफल रहा।"));
        document.getElementById("syncBtn").disabled = false;
      }
    }

    function createSession(start, end, steps, sessionTitle) {
      const sessionId = "walk_" + start;
      fetch("https://www.googleapis.com/fitness/v1/users/me/sessions/" + sessionId, {
        method: "PUT",
        headers: {
          Authorization: "Bearer " + accessToken,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          id: sessionId,
          name: sessionTitle,
          description: "Walking activity",
          startTimeMillis: start,
          endTimeMillis: end,
          activeTimeMillis: (end - start),
          version: 1,
          activityType: 7
        })
      })
      .then(() => {
        addLog("✅ '" + sessionTitle + "' सेशन रिकॉर्ड हो गया।");
        logToSheet(steps);
      });
    }

    function logToSheet(steps) {
      fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: userEmail, steps: steps, status: "SUCCESS" })
      });
    }
  </script>
</body>
</html>
