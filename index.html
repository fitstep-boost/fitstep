<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FitStep Boost</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #0b1320;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    .card {
      background-color: #162235;
      border: 1px solid #22344d;
      border-radius: 16px;
      width: 100%;
      max-width: 420px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .title {
      font-size: 24px;
      font-weight: 700;
      color: #38bdf8;
      text-align: center;
      margin-bottom: 6px;
    }
    .subtitle {
      font-size: 13px;
      color: #94a3b8;
      text-align: center;
      margin-bottom: 24px;
    }
    .user-box {
      background-color: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 14px;
      text-align: center;
      margin-bottom: 20px;
    }
    .user-label {
      font-size: 11px;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    .user-email {
      font-size: 14px;
      font-weight: 600;
      color: #38bdf8;
      word-break: break-all;
      margin-bottom: 10px;
    }
    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: none;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-login {
      background-color: #0284c7;
      color: #ffffff;
    }
    .btn-ad {
      background-color: #0284c7;
      color: #ffffff;
      margin-bottom: 12px;
    }
    .btn-ad:disabled {
      background-color: #334155;
      color: #64748b;
      cursor: not-allowed;
    }
    .btn-logout {
      background-color: #ef4444;
      color: #ffffff;
      padding: 6px 14px;
      font-size: 12px;
      border-radius: 6px;
      width: auto;
      display: inline-block;
    }
    .counter {
      font-size: 13px;
      font-weight: 600;
      color: #38bdf8;
      text-align: center;
      margin-bottom: 16px;
    }
    .log-box {
      background-color: #090e17;
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 12px;
      min-height: 120px;
      max-height: 160px;
      overflow-y: auto;
      font-size: 12px;
      line-height: 1.6;
      color: #cbd5e1;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="title">FitStep Boost</div>
    <div class="subtitle">Google Fit स्टेप्स ऑटोमेशन (सुरक्षित सिंक टूल)</div>

    <!-- Login Section -->
    <div id="login-section">
      <button class="btn btn-login" onclick="triggerGoogleLogin()">Google Fit से कनेक्ट करें</button>
    </div>

    <!-- Dashboard Section -->
    <div id="dashboard-section" class="hidden">
      <div class="user-box">
        <div class="user-label">लॉगिन अकाउंट</div>
        <div id="user-email-text" class="user-email">--</div>
        <button class="btn btn-logout" onclick="logout()">साइन आउट (लॉगआउट)</button>
      </div>

      <button id="ad-btn" class="btn btn-ad" onclick="watchAd()">ऐड्स देखें और सिंक शुरू करें (0/5)</button>
      <div id="counter-text" class="counter">देखे गए ऐड्स: 0 / 5</div>
    </div>

    <!-- Console Log -->
    <div id="log-box" class="log-box">तैयार... कृपया लॉगिन करें।</div>
  </div>

  <script>
    let adsWatched = 0;
    const TOTAL_ADS = 5;
    let currentUser = null;

    function log(msg) {
      const box = document.getElementById("log-box");
      box.innerHTML += "<br>" + msg;
      box.scrollTop = box.scrollHeight;
    }

    // Google Sign-In Initializer
    function triggerGoogleLogin() {
      log("लॉगिन विंडो खोली जा रही है...");
      google.accounts.id.initialize({
        client_id: "883838274712-42qge0o8g6718d7jef4b1l4c88r04e9o.apps.googleusercontent.com",
        callback: handleCredentialResponse,
        auto_select: true
      });
      google.accounts.id.prompt();
    }

    function handleCredentialResponse(response) {
      try {
        const payload = JSON.parse(atob(response.credential.split('.')[1]));
        currentUser = payload.email;
        document.getElementById("user-email-text").innerText = currentUser;
        document.getElementById("login-section").classList.add("hidden");
        document.getElementById("dashboard-section").classList.remove("hidden");
        log
