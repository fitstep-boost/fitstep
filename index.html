<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitStep Boost</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
    }
    .card {
      background: #1e293b;
      border-radius: 16px;
      width: 100%;
      max-width: 420px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      text-align: center;
    }
    h1 { font-size: 24px; font-weight: 700; margin-bottom: 6px; color: #38bdf8; }
    p.sub { font-size: 13px; color: #94a3b8; margin-bottom: 20px; }
    .user-box {
      background: #0f172a;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 16px;
      font-size: 13px;
      word-break: break-all;
    }
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 12px;
      transition: all 0.2s;
    }
    .btn-login { background: #2563eb; color: #fff; }
    .btn-ad { background: #0284c7; color: #fff; }
    .btn-sync { background: #16a34a; color: #fff; }
    .btn-logout { background: #dc2626; color: #fff; padding: 8px 16px; font-size: 12px; width: auto; margin-top: 8px; border-radius: 6px; }
    .btn:disabled { background: #334155; color: #64748b; cursor: not-allowed; }
    .status-text {
      background: #0f172a;
      border-radius: 10px;
      padding: 14px;
      font-size: 12px;
      color: #94a3b8;
      text-align: left;
      line-height: 1.6;
      margin-top: 14px;
      max-height: 160px;
      overflow-y: auto;
    }
    .status-text b { color: #38bdf8; }
  </style>
</head>
<body>

  <div class="card">
    <h1>FitStep Boost</h1>
    <p class="sub">Google Fit Steps Automation</p>

    <div id="loginSection">
      <button id="loginBtn" class="btn btn-login" onclick="login()">Google Fit se Login Karein</button>
    </div>

    <div id="appSection" style="display: none;">
      <div class="user-box">
        Login Account:<br><b id="userEmailText"></b><br>
        <button class="btn btn-logout" onclick="logout()">Sign Out</button>
      </div>

      <button id="adBtn" class="btn btn-ad" onclick="playAd()" disabled>Ads Dekhein (0 / 5)</button>
      <button id="syncBtn" class="btn btn-sync" onclick="syncSteps()" disabled>Steps Sync Karein</button>
    </div>

    <div id="statusBox" class="status-text">Taiyaar... Kripya login karein.</div>
  </div>

  <script>
    const APP_VERSION = "1.0";
    const CLIENT_ID = "198753021000-di6e8eklooh5bbo34f002b5c3b1a3958.apps.googleusercontent.com";
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx0af3er7Y8i5yNBBUdKfaos15Z9METmiYl05acKw3cPeUE2j7nHkN02m-dPxXYm_1_/exec";

    let tokenClient;
    let accessToken = null;
    let userEmail = "";
    let adsWatched = 0;
    const requiredAds = 5;

    function addLog(msg) {
      const box = document.getElementById("statusBox");
      box.innerHTML += "<br>" + msg;
      box.scrollTop = box.scrollHeight;
    }

    window.onload = function() {
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: "https://www.googleapis.com/auth/fitness.activity.write https://www.googleapis.com/auth/userinfo.email openid",
        callback: (tokenResponse) => {
          if (tokenResponse && tokenResponse.access_token) {
            accessToken = tokenResponse.access_token;
            fetchEmail();
          }
        }
      });
    };

    function login() {
      tokenClient.requestAccessToken({ prompt: "" });
    }

    function logout() {
      accessToken = null;
      userEmail = "";
      adsWatched = 0;
      document.getElementById("loginSection").style.display = "block";
      document.getElementById("appSection").style.display = "none";
      document.getElementById("statusBox").innerHTML = "Sign out ho gaya. Dobara login karein.";
    }

    function fetchEmail() {
      addLog("User profile load ho rahi hai...");
      fetch("https://www.googleapis.com/oauth2/v2/userinfo", {
        headers: { Authorization: "Bearer " + accessToken }
      })
      .then(r => r.json())
      .then(info => {
        userEmail = info.email;
        document.getElementById("userEmailText").innerText = userEmail;
        document.getElementById("loginSection").style.display = "none";
        document.getElementById("appSection").style.display = "block";
        addLog("Account: <b>" + userEmail + "</b>");
        verifyWhitelist(userEmail);
      })
      .catch(e => addLog("Profile error: " + e.message));
    }

    function verifyWhitelist(email) {
      addLog("Admin anumati & App Version check ho raha hai...");
      const callbackName = "jsonp_cb_" + Math.round(Math.random() * 100000);
      window[callbackName] = function(data) {
        delete window[callbackName];
        if (script.parentNode) script.parentNode.removeChild(script);

        if (data.allowed) {
          addLog("✅ Anumati Swikrit (Approved)! Aap ads dekh sakte hain.");
          document.getElementById("adBtn").disabled = false;
        } else if (data.status === "OUTDATED_VERSION") {
          addLog("❌ <b>App Outdated:</b> Naya version " + data.requiredVersion + " uplabdh hai. Kripya naya APK install karein.");
          alert("Aapka App version purana ho gaya hai! Kripya naya version update karein.");
        } else {
          addLog("⏳ Anumati Lamvit (Pending) ya Blocked hai. Admin se sampark karein.");
        }
      };

      const script = document.createElement("script");
      script.src = SCRIPT_URL + "?email=" + encodeURIComponent(email) + "&version=" + APP_VERSION + "&callback=" + callbackName;
      document.body.appendChild(script);
    }

    function playAd() {
      if (window.AndroidBridge && window.AndroidBridge.showRewardedAd) {
        window.AndroidBridge.showRewardedAd();
      } else {
        alert("Mobile app bridge connect nahi hua.");
      }
    }

    window.adRewardCompleted = function() {
      adsWatched++;
      document.getElementById("adBtn").innerText = "Ads Dekhein (" + adsWatched + " / " + requiredAds + ")";
      addLog("Ad safalta se dekha gaya (" + adsWatched + "/" + requiredAds + ")");

      if (adsWatched >= requiredAds) {
        document.getElementById("adBtn").disabled = true;
        document.getElementById("syncBtn").disabled = false;
        addLog("🎉 5 ads pure ho gaye! Ab Steps Sync button dabayein.");
      }
    };

    function syncSteps() {
      document.getElementById("syncBtn").disabled = true;
      addLog("Steps calculate ho rahe hain...");

      const totalSteps = Math.floor(Math.random() * (12500 - 11200 + 1)) + 11200;
      const now = Date.now();
      const startTimeMillis = now - (6 * 60 * 60 * 1000);
      const endTimeMillis = now - (15 * 60 * 1000);

      const startTimeNs = BigInt(startTimeMillis) * BigInt(1000000);
      const endTimeNs = BigInt(endTimeMillis) * BigInt(1000000);
      const datasetId = startTimeNs.toString() + "-" + endTimeNs.toString();
      const dataSourceId = "raw:com.google.step_count.delta:com.google.android.gms:estimated_steps";

      const payload = {
        dataSourceId: dataSourceId,
        minStartTimeNs: startTimeNs.toString(),
        maxEndTimeNs: endTimeNs.toString(),
        point: [{
          startTimeNanos: startTimeNs.toString(),
          endTimeNanos: endTimeNs.toString(),
          dataTypeName: "com.google.step_count.delta",
          value: [{ intVal: totalSteps }]
        }]
      };

      fetch("https://www.googleapis.com/fitness/v1/users/me/dataSources/" + encodeURIComponent(dataSourceId) + "/datasets/" + datasetId, {
        method: "PATCH",
        headers: {
          Authorization: "Bearer " + accessToken,
          "Content-Type": "application/json"
        },
        body: JSON.stringify(payload)
      })
      .then(res => {
        if (res.ok) {
          addLog("✅ " + totalSteps + " Steps safalta se sync ho gaye!");
          createSession(startTimeMillis, endTimeMillis, totalSteps);
        } else {
          addLog("Sync error: API request fail ho gayi.");
        }
      })
      .catch(e => addLog("Network error: " + e.message));
    }

    function createSession(start, end, steps) {
      const sessionId = "fitstep_" + start;
      fetch("https://www.googleapis.com/fitness/v1/users/me/sessions/" + sessionId, {
        method: "PUT",
        headers: {
          Authorization: "Bearer " + accessToken,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          id: sessionId,
          name: "Brisk Walk",
          description: "FitStep Boost Session",
          startTimeMillis: start,
          endTimeMillis: end,
          version: 1,
          activityType: 7
        })
      })
      .then(() => {
        addLog("✅ Walk session record ho gaya.");
        logToSheet(steps);
      });
    }

    function logToSheet(steps) {
      fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: userEmail, steps: steps, status: "SUCCESS" })
      });
    }
  </script>
</body>
</html>
