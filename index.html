<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FitStep Tracker</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 16px;
            padding-bottom: 75px; /* Sticky banner space */
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 420px;
            background: #1e293b;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        h1 { font-size: 24px; margin: 0 0 4px 0; text-align: center; color: #38bdf8; }
        .subtitle { font-size: 13px; color: #94a3b8; text-align: center; margin-bottom: 20px; }
        
        .card {
            background: #0f172a;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 16px;
            border: 1px solid #334155;
        }
        .label { font-size: 12px; color: #94a3b8; margin-bottom: 4px; text-align: center; }
        .val { font-size: 14px; font-weight: bold; color: #38bdf8; word-break: break-all; text-align: center; }

        .btn-group { display: flex; gap: 8px; margin-top: 10px; }
        button {
            width: 100%;
            padding: 13px;
            border-radius: 10px;
            border: none;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s ease;
        }
        .btn-primary { background: #0284c7; color: white; margin-top: 10px; }
        .btn-primary:active { background: #0369a1; }
        .btn-primary:disabled { background: #475569; color: #94a3b8; cursor: not-allowed; }
        
        .btn-secondary { background: #0ea5e9; color: white; }
        .btn-danger { background: #ef4444; color: white; }

        .btn-timer {
            background: #334155 !important;
            color: #f87171 !important;
            border: 1px dashed #ef4444 !important;
        }

        .counter-badge {
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            color: #38bdf8;
            margin: 8px 0 14px 0;
        }

        .log-box {
            background: #090d16;
            border-radius: 10px;
            padding: 10px;
            font-family: monospace;
            font-size: 11px;
            max-height: 180px;
            overflow-y: auto;
            color: #cbd5e1;
            border: 1px solid #1e293b;
        }
        .log-line { margin-bottom: 4px; line-height: 1.4; }
    </style>
</head>
<body>

<div class="container">
    <h1>FitStep Tracker</h1>
    <div class="subtitle">Google Fit एक्टिविटी सिंक टूल</div>

    <div class="card" id="account-card">
        <div class="label">लॉगिन अकाउंट</div>
        <div class="val" id="user-email">जाँच जारी है...</div>
        <div class="btn-group" id="auth-buttons" style="display: none;">
            <button class="btn-secondary" onclick="checkAuthStatus()">स्थिति रिफ्रेश करें 🔄</button>
            <button class="btn-danger" onclick="signOutUser()">साइन आउट</button>
        </div>
        <button class="btn-primary" id="btn-login" style="display: none;" onclick="loginGoogleFit()">Google Fit से लॉगिन करें</button>
    </div>

    <button id="btn-ad" class="btn-primary" onclick="watchAdClick()">ऐड्स देखें और सिंक शुरू करें (0/5)</button>
    <div class="counter-badge" id="ad-counter-text">देखे गए ऐड्स: 0 / 5</div>

    <button id="btn-sync" class="btn-primary" disabled onclick="startSyncProcess()">स्टेप्स सिंक करें</button>

    <div style="margin-top: 16px;">
        <div class="log-box" id="log-box"></div>
    </div>
</div>

<script>
    let adsWatched = 0;
    const TOTAL_ADS_REQUIRED = 5;
    let userEmail = null;
    let accessToken = null;
    let isCoolingDown = false;

    function addLog(msg) {
        const box = document.getElementById('log-box');
        const div = document.createElement('div');
        div.className = 'log-line';
        div.innerHTML = msg;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    function updateAdStatusUI() {
        const btnAd = document.getElementById('btn-ad');
        const counterText = document.getElementById('ad-counter-text');
        const btnSync = document.getElementById('btn-sync');

        counterText.innerText = `देखे गए ऐड्स: ${adsWatched} / ${TOTAL_ADS_REQUIRED}`;
        
        if (adsWatched >= TOTAL_ADS_REQUIRED) {
            btnAd.innerText = `✅ 5 ऐड्स पूर्ण हुए`;
            btnAd.disabled = true;
            btnSync.disabled = false;
        } else {
            btnAd.innerText = `ऐड्स देखें और सिंक शुरू करें (${adsWatched}/${TOTAL_ADS_REQUIRED})`;
        }
    }

    function watchAdClick() {
        if (isCoolingDown || adsWatched >= TOTAL_ADS_REQUIRED) return;
        const btn = document.getElementById('btn-ad');
        btn.disabled = true;
        btn.innerText = "⏳ ऐड लोड हो रहा है...";
        
        if (window.AndroidBridge && window.AndroidBridge.showRewardedAd) {
            window.AndroidBridge.showRewardedAd();
        } else {
            addLog("⚠️ ब्रिज उपलब्ध नहीं है।");
            enableAdButton();
        }
    }

    function enableAdButton() {
        if (isCoolingDown || adsWatched >= TOTAL_ADS_REQUIRED) return;
        const btn = document.getElementById('btn-ad');
        btn.disabled = false;
        btn.classList.remove('btn-timer');
        updateAdStatusUI();
    }

    // Called by Android Native Code when Rewarded Ad Finishes
    window.adRewardCompleted = function() {
        adsWatched++;
        addLog(`✅ ऐड सफलतापूर्वक पूरा देखा गया (${adsWatched}/${TOTAL_ADS_REQUIRED})`);
        
        if (adsWatched >= TOTAL_ADS_REQUIRED) {
            updateAdStatusUI();
            addLog("🎉 बधाई! सभी 5 ऐड्स पूरे हुए। अब 'स्टेप्स सिंक करें' बटन दबाएँ।");
        } else {
            startAdCooldown(5);
        }
    };

    function startAdCooldown(seconds) {
        isCoolingDown = true;
        const btn = document.getElementById('btn-ad');
        btn.disabled = true;
        btn.classList.add('btn-timer');
        
        let timeLeft = seconds;
        btn.innerText = `⏳ अगला ऐड तैयार हो रहा है (${timeLeft}s)...`;

        const interval = setInterval(() => {
            timeLeft--;
            if (timeLeft > 0) {
                btn.innerText = `⏳ अगला ऐड तैयार हो रहा है (${timeLeft}s)...`;
            } else {
                clearInterval(interval);
                isCoolingDown = false;
                btn.classList.remove('btn-timer');
                enableAdButton();
            }
        }, 1000);
    }

    // Google Fit Auth
    function extractTokenFromUrl() {
        const hash = window.location.hash.substring(1);
        const params = new URLSearchParams(hash);
        if (params.has('access_token')) {
            accessToken = params.get('access_token');
            sessionStorage.setItem('gf_token', accessToken);
            window.history.replaceState({}, document.title, window.location.pathname);
            fetchUserProfile();
        } else {
            accessToken = sessionStorage.getItem('gf_token');
            if (accessToken) {
                fetchUserProfile();
            } else {
                showLoginUI();
            }
        }
    }

    function loginGoogleFit() {
        const clientId = "580649721798-h53e28v42c92eamf6u5654g39qkgff1m.apps.googleusercontent.com";
        const redirectUri = "https://fitstep-boost.github.io/fitstep/";
        const scope = encodeURIComponent("https://www.googleapis.com/auth/fitness.activity.write https://www.googleapis.com/auth/userinfo.email");
        const authUrl = `https://accounts.google.com/o/oauth2/v2/auth?response_type=token&client_id=${clientId}&redirect_uri=${redirectUri}&scope=${scope}`;
        window.location.href = authUrl;
    }

    function fetchUserProfile() {
        addLog("यूज़र प्रोफाइल लोड हो रहा है...");
        fetch('https://www.googleapis.com/oauth2/v2/userinfo', {
            headers: { 'Authorization': `Bearer ${accessToken}` }
        })
        .then(res => {
            if (!res.ok) throw new Error("Auth Token Expired");
            return res.json();
        })
        .then(data => {
            userEmail = data.email;
            document.getElementById('user-email').innerText = userEmail;
            document.getElementById('auth-buttons').style.display = 'flex';
            document.getElementById('btn-login').style.display = 'none';
            addLog(`अकाउंट: <b>${userEmail}</b>`);
            addLog("✅ अनुमति स्वीकृत (Approved): आप सिंक कर सकते हैं।");
        })
        .catch(err => {
            sessionStorage.removeItem('gf_token');
            showLoginUI();
        });
    }

    function showLoginUI() {
        document.getElementById('user-email').innerText = "लॉगिन नहीं है";
        document.getElementById('auth-buttons').style.display = 'none';
        document.getElementById('btn-login').style.display = 'block';
    }

    function signOutUser() {
        sessionStorage.removeItem('gf_token');
        accessToken = null;
        userEmail = null;
        showLoginUI();
        addLog("साइन आउट सफल।");
    }

    function checkAuthStatus() {
        extractTokenFromUrl();
    }

    // Steps & Heart Points Sync
    async function startSyncProcess() {
        if (!accessToken) {
            alert("कृपया पहले लॉगिन करें!");
            return;
        }
        const btnSync = document.getElementById('btn-sync');
        btnSync.disabled = true;
        btnSync.innerText = "सिंक हो रहा है...";
        addLog("🚀 स्टेप्स और हार्ट पॉइंट्स Google Fit में भेजे जा रहे हैं...");

        const now = Date.now();
        const oneHourAgo = now - (60 * 60 * 1000);
        const startTimeNanos = oneHourAgo * 1000000;
        const endTimeNanos = now * 1000000;

        try {
            // 1. Sync Steps
            const stepDataSourceId = "raw:com.google.step_count.delta:com.fitstep.boost:fitstep_step_source";
            await createDataSourceIfNotExists(stepDataSourceId, "com.google.step_count.delta");
            await insertStepsData(stepDataSourceId, startTimeNanos, endTimeNanos, 6500);

            // 2. Sync Heart Points
            const hpDataSourceId = "raw:com.google.heart_minutes:com.fitstep.boost:fitstep_hp_source";
            await createDataSourceIfNotExists(hpDataSourceId, "com.google.heart_minutes");
            await insertHeartPointsData(hpDataSourceId, startTimeNanos, endTimeNanos, 45.0);

            addLog("✅ <b>बधाई! 6,500 स्टेप्स और 45 हार्ट पॉइंट्स सफलतापूर्वक Google Fit में दर्ज हो गए हैं।</b>");
            btnSync.innerText = "सिंक पूर्ण हुआ ✔";

            // Trigger Interstitial Ad ONLY after successful sync
            setTimeout(() => {
                if (window.AndroidBridge && window.AndroidBridge.showInterstitialAd) {
                    window.AndroidBridge.showInterstitialAd();
                }
            }, 600);

        } catch (error) {
            addLog("❌ सिंक त्रुटि: " + error.message);
            btnSync.disabled = false;
            btnSync.innerText = "पुनः प्रयास करें";
        }
    }

    async function createDataSourceIfNotExists(dataSourceId, dataType) {
        const body = {
            "dataStreamName": dataSourceId,
            "type": "raw",
            "application": { "name": "FitStep Boost", "version": "1.0" },
            "dataType": { "name": dataType }
        };
        await fetch('https://www.googleapis.com/fitness/v1/users/me/dataSources', {
            method: 'POST',
            headers: {
                'Authorization': `Bearer ${accessToken}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(body)
        });
    }

    async function insertStepsData(dataSourceId, startNanos, endNanos, steps) {
        const datasetId = `${startNanos}-${endNanos}`;
        const body = {
            "dataSourceId": dataSourceId,
            "maxEndTimeNanos": endNanos,
            "minStartTimeNanos": startNanos,
            "point": [{
                "startTimeNanos": startNanos,
                "endTimeNanos": endNanos,
                "dataTypeName": "com.google.step_count.delta",
                "value": [{ "intVal": steps }]
            }]
        };
        const res = await fetch(`https://www.googleapis.com/fitness/v1/users/me/dataSources/${dataSourceId}/datasets/${datasetId}`, {
            method: 'PATCH',
            headers: {
                'Authorization': `Bearer ${accessToken}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(body)
        });
        if (!res.ok) throw new Error("स्टेप्स सिंक विफल");
    }

    async function insertHeartPointsData(dataSourceId, startNanos, endNanos, hp) {
        const datasetId = `${startNanos}-${endNanos}`;
        const body = {
            "dataSourceId": dataSourceId,
            "maxEndTimeNanos": endNanos,
            "minStartTimeNanos": startNanos,
            "point": [{
                "startTimeNanos": startNanos,
                "endTimeNanos": endNanos,
                "dataTypeName": "com.google.heart_minutes",
                "value": [{ "fpVal": hp }]
            }]
        };
        const res = await fetch(`https://www.googleapis.com/fitness/v1/users/me/dataSources/${dataSourceId}/datasets/${datasetId}`, {
            method: 'PATCH',
            headers: {
                'Authorization': `Bearer ${accessToken}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(body)
        });
        if (!res.ok) throw new Error("हार्ट पॉइंट्स सिंक विफल");
    }

    window.onload = function() {
        extractTokenFromUrl();
        updateAdStatusUI();
    };
</script>
</body>
</html>
