<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitStep Tracker</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0b1120;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
      padding-bottom: 85px;
    }
    .card {
      background: #1e293b;
      border-radius: 20px;
      width: 100%;
      max-width: 420px;
      padding: 26px 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      text-align: center;
      position: relative;
    }
    h1 { font-size: 24px; font-weight: 700; margin-bottom: 6px; color: #38bdf8; }
    p.sub { font-size: 13px; color: #94a3b8; margin-bottom: 18px; }
    .input-box {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
      text-align: left;
    }
    .input-label { font-size: 12px; color: #94a3b8; margin-bottom: 6px; display: block; }
    .text-input {
      width: 100%;
      background: #1e293b;
      color: #38bdf8;
      border: 1px solid #0284c7;
      border-radius: 8px;
      padding: 10px;
      font-size: 14px;
      font-weight: 600;
      outline: none;
    }
    .user-box {
      background: #0f172a;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
      font-size: 13px;
      word-break: break-all;
    }
    .user-label { color: #94a3b8; font-size: 12px; margin-bottom: 4px; }
    .user-email { color: #38bdf8; font-weight: 600; font-size: 14px; margin-bottom: 10px; }
    .btn-row {
      display: flex;
      gap: 8px;
      justify-content: center;
    }
    .date-picker-box {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 14px;
      text-align: left;
    }
    .date-picker-label {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 6px;
      display: block;
    }
    .date-input {
      width: 100%;
      background: #1e293b;
      color: #38bdf8;
      border: 1px solid #0284c7;
      border-radius: 8px;
      padding: 10px;
      font-size: 14px;
      font-weight: 600;
      outline: none;
    }
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 12px;
      transition: all 0.2s;
    }
    .btn-verify { background: #0284c7; color: #fff; }
    .btn-login { background: #16a34a; color: #fff; }
    .btn-ad { background: #0284c7; color: #fff; }
    .btn-timer {
      background: #334155 !important;
      color: #f87171 !important;
      border: 1px dashed #ef4444 !important;
    }
    .btn-sync { background: #1e3a5f; color: #64748b; }
    .btn-sync.active { background: #16a34a; color: #fff; }
    .btn-logout { background: #ef4444; color: #fff; padding: 7px 14px; font-size: 12px; border-radius: 8px; width: auto; }
    .btn-refresh { background: #0284c7; color: #fff; padding: 7px 14px; font-size: 12px; border-radius: 8px; width: auto; }
    .btn:disabled { background: #1e293b; border: 1px solid #334155; color: #475569; cursor: not-allowed; }
    .ad-counter-text { font-size: 13px; color: #38bdf8; margin-bottom: 16px; font-weight: 500; }
    
    .sync-timer-card {
      background: #0f172a;
      border: 1px solid #0284c7;
      border-radius: 12px;
      padding: 14px;
      margin-top: 10px;
      margin-bottom: 12px;
      display: none;
    }
    .sync-timer-title { font-size: 12px; color: #94a3b8; margin-bottom: 6px; }
    .sync-timer-clock { font-size: 26px; font-weight: bold; color: #38bdf8; letter-spacing: 1px; }

    .completion-message-card {
      display: none;
      padding: 40px 16px;
      text-align: center;
    }
    .completion-title {
      font-size: 20px;
      font-weight: 800;
      color: #4ade80;
      line-height: 1.6;
    }

    .status-text {
      background: #0f172a;
      border-radius: 12px;
      padding: 14px;
      font-size: 12px;
      color: #94a3b8;
      text-align: left;
      line-height: 1.7;
      margin-top: 14px;
      max-height: 170px;
      overflow-y: auto;
    }
    .status-text b { color: #38bdf8; }
  </style>
</head>
<body>

  <div class="card" id="mainCard">
    <div id="activeContent">
      <h1>FitStep Tracker</h1>
      <p class="sub">Google Fit एक्टिविटी सिंक टूल</p>

      <!-- ईमेल वेरिफिकेशन सेक्शन -->
      <div id="verifySection">
        <div class="input-box">
          <label class="input-label" for="emailInput">अपना Google (Gmail) अकाउंट दर्ज करें:</label>
          <input type="email" id="emailInput" class="text-input" placeholder="example@gmail.com">
        </div>
        <button id="verifyBtn" class="btn btn-verify" onclick="handleVerifyClick()">खाता सत्यापित करें</button>
        <div id="pendingArea" style="display: none; margin-top: 10px;">
          <button class="btn btn-refresh" style="width: 100%;" onclick="refreshStatusManually()">स्थिति रिफ्रेश करें 🔄</button>
        </div>
      </div>

      <!-- Google Login सेक्शन -->
      <div id="loginSection" style="display: none;">
        <button id="loginBtn" class="btn btn-login" onclick="login()">Google Fit से लॉगिन करें</button>
      </div>

      <!-- मुख्य ऐप सेक्शन -->
      <div id="appSection" style="display: none;">
        <div class="user-box">
          <div class="user-label">लॉगिन अकाउंट</div>
          <div id="userEmailText" class="user-email"></div>
          <div class="btn-row">
            <button class="btn btn-refresh" onclick="refreshStatusManually()">स्थिति रिफ्रेश करें 🔄</button>
            <button class="btn btn-logout" onclick="logout()">साइन आउट (लॉगआउट)</button>
          </div>
        </div>

        <div class="date-picker-box">
          <label class="date-picker-label" for="syncDateInput">📅 सिंक की तारीख चुनें (डिफ़ॉल्ट: आज):</label>
          <input type="date" id="syncDateInput" class="date-input">
        </div>

        <button id="adBtn" class="btn btn-ad" onclick="playAd()" disabled>ऐड्स देखें और सिंक शुरू करें (0/5)</button>
        <div id="adCounter" class="ad-counter-text">देखे गए ऐड्स: 0 / 5</div>
        <button id="syncBtn" class="btn btn-sync" onclick="syncSteps()" disabled>स्टेप्स सिंक करें</button>

        <div id="syncTimerCard" class="sync-timer-card">
          <div class="sync-timer-title">⏳ Google Fit सर्वर सिंक जारी है... कृपया स्क्रीन खुली रखें</div>
          <div id="syncTimerClock" class="sync-timer-clock">03:00</div>
        </div>
      </div>

      <div id="statusBox" class="status-text">तैयार... कृपया अपनी ईमेल दर्ज करके सत्यापित करें।</div>
    </div>

    <!-- Final Center Message -->
    <div id="completionMessageCard" class="completion-message-card">
      <div style="font-size: 46px; margin-bottom: 14px;">✅</div>
      <div class="completion-title">
        अब आप इस ऐप को बंद कर सकते हैं।<br>आपके सारे स्टेप लोड हो गए हैं।
      </div>
    </div>
  </div>
    <script>
    const APP_VERSION = "1.0";
    
    // पूरे 10 Google Cloud प्रोजेक्ट्स की Client IDs (0 से 9)
    const CLIENT_IDS = [
      "198753021000-di6e8eklooh5bbo34f002b5c3b1a3958.apps.googleusercontent.com", // Project 1 (Index 0)[span_6](start_span)[span_6](end_span)
      "95598674623-lbq58ut471slk8v9e5775epl9qo674be.apps.googleusercontent.com",   // Project 2 (Index 1)
      "990823229249-o06umprs5eomesh2iksotnf45t7394dd.apps.googleusercontent.com",  // Project 3 (Index 2)
      "895492609983-imnvm5vug7pgecvvectbgg56pp7nj78e.apps.googleusercontent.com",  // Project 4 (Index 3)
      "601661509621-0se2c41tb4rkqg8crlq25rpdj52bmn2.apps.googleusercontent.com",  // Project 5 (Index 4)
      "483535479488-rppedqajjleadje2190k45vt8jgf09s0b.apps.googleusercontent.com",  // Project 6 (Index 5)
      "160429550495-0qqvekeeqfe4ouehq7ffnph0dhm27toh.apps.googleusercontent.com",  // Project 7 (Index 6)
      "280068312235-4ne1ca87r22tm1lumo0k007d4uop6vvm.apps.googleusercontent.com",  // Project 8 (Index 7)
      "95428386979-p7filbh6ts4dins8gbi6202lkt7s90gg.apps.googleusercontent.com",   // Project 9 (Index 8)
      "414302529196-5d4117p3l1agea2jrs3u47vrc6j06pi7.apps.googleusercontent.com"   // Project 10 (Index 9)
    ];

    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbydwLePvwnQzl_BHpnWo2xeGYLkqS4VENaWqJV9VouEMj5ntIj8m4eRnCJy3SgeGWeX9Q/exec";[span_7](start_span)[span_7](end_span)
    const ADMIN_EMAIL = "sunilsehrawat56@gmail.com";[span_8](start_span)[span_8](end_span)

    let tokenClient = null;
    let accessToken = null;
    let verifiedEmail = "";
    let assignedProjectIndex = 0;
    let adsWatched = 0;
    const requiredAds = 5;
    let isCoolingDown = false;
    let pollingTimer = null;

    function addLog(msg) {
      const box = document.getElementById("statusBox");
      if (box) {
        box.innerHTML += "<br>" + msg;
        box.scrollTop = box.scrollHeight;
      }
    }

    function enableAdButton() {
      if (!isCoolingDown && adsWatched < requiredAds) {
        const btn = document.getElementById("adBtn");
        btn.disabled = false;
        btn.classList.remove("btn-timer");
        btn.innerText = "ऐड्स देखें और सिंक शुरू करें (" + adsWatched + "/5)";
      }
    }

    function setupDatePicker() {
      const dateInput = document.getElementById("syncDateInput");
      const today = new Date();
      const past30Days = new Date();
      past30Days.setDate(today.getDate() - 30);

      const formatDate = (d) => {
        const year = d.getFullYear();
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
      };

      dateInput.value = formatDate(today);
      dateInput.max = formatDate(today);
      dateInput.min = formatDate(past30Days);
    }

    window.onload = function() {
      setupDatePicker();
      const savedEmail = localStorage.getItem("fitstep_saved_email");
      if (savedEmail) {
        document.getElementById("emailInput").value = savedEmail;
        checkWhitelistStatus(savedEmail, false);
      }
    };

    function handleVerifyClick() {
      const emailField = document.getElementById("emailInput");
      const email = emailField.value.toLowerCase().replace(/\s+/g, "").trim();
      if (!email || !email.includes("@")) {
        alert("कृपया सही Gmail ID दर्ज करें!");
        return;
      }
      localStorage.setItem("fitstep_saved_email", email);
      checkWhitelistStatus(email, true);
    }

    function refreshStatusManually() {
      const email = verifiedEmail || document.getElementById("emailInput").value.toLowerCase().replace(/\s+/g, "").trim();
      if (email) {
        addLog("स्थिति जाँची जा रही है...");
        checkWhitelistStatus(email, false);
      }
    }

    function checkWhitelistStatus(email, showInitialLog) {
      if (showInitialLog) {
        addLog("सर्वर पर अनुमति जाँची जा रही है...");
      }

      const callbackName = "jsonp_cb_" + Math.round(Math.random() * 100000);
      window[callbackName] = function(data) {
        delete window[callbackName];
        if (script.parentNode) script.parentNode.removeChild(script);

        if (data.allowed) {
          if (pollingTimer) {
            clearInterval(pollingTimer);
            pollingTimer = null;
          }

          verifiedEmail = email;
          assignedProjectIndex = Number(data.projectIndex || 0);
          addLog("✅ <b>अनुमति स्वीकृत (Approved):</b> Project " + (assignedProjectIndex + 1) + " आवंटित।");
          
          document.getElementById("verifySection").style.display = "none";
          document.getElementById("loginSection").style.display = "block";

          initOAuthClient(assignedProjectIndex);

        } else if (data.status === "BLOCKED") {
          if (pollingTimer) {
            clearInterval(pollingTimer);
            pollingTimer = null;
          }
          addLog("⛔ <b>खाता ब्लॉक है:</b> इस खाते को सिंक करने की अनुमति नहीं है।");
          document.getElementById("pendingArea").style.display = "none";
        } else {
          addLog("⏳ आपकी अनुमति लंबित (Pending) है। एडमिन की मंज़ूरी का इंतज़ार करें...");
          document.getElementById("pendingArea").style.display = "block";

          if (!pollingTimer) {
            pollingTimer = setInterval(() => {
              checkWhitelistStatus(email, false);
            }, 8000);
          }
        }
      };

      const script = document.createElement("script");
      script.src = SCRIPT_URL + "?email=" + encodeURIComponent(email) + "&version=" + APP_VERSION + "&_t=" + Date.now() + "&callback=" + callbackName;
      document.body.appendChild(script);
    }

    function initOAuthClient(projectIndex) {
      const clientId = CLIENT_IDS[projectIndex] || CLIENT_IDS[0];
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: clientId,
        scope: "https://www.googleapis.com/auth/fitness.activity.read https://www.googleapis.com/auth/fitness.activity.write https://www.googleapis.com/auth/fitness.heart_rate.write https://www.googleapis.com/auth/fitness.location.write https://www.googleapis.com/auth/userinfo.email openid",
        callback: (tokenResponse) => {
          if (tokenResponse && tokenResponse.access_token) {
            accessToken = tokenResponse.access_token;
            fetchEmailAndVerify();
          } else if (tokenResponse && tokenResponse.error) {
            addLog("❌ लॉगिन विफलता: " + tokenResponse.error);
          }
        }
      });
    }

    function login() {
      addLog("Google लॉगिन खोला जा रहा है...");
      if (tokenClient) {
        tokenClient.requestAccessToken({ prompt: "select_account", hint: verifiedEmail });
      } else {
        addLog("⏳ सेवाएँ तैयार हो रही हैं, 2 सेकंड बाद प्रयास करें...");
      }
    }

    function fetchEmailAndVerify() {
      addLog("Google प्रोफाइल लोड हो रही है...");
      fetch("https://www.googleapis.com/oauth2/v2/userinfo", {
        headers: { Authorization: "Bearer " + accessToken }
      })
      .then(r => r.json())
      .then(info => {
        const loggedEmail = info.email.toLowerCase().replace(/\s+/g, "").trim();
        if (loggedEmail !== verifiedEmail) {
          alert("गड़बड़ी: आपने सत्यापित की गई ईमेल (" + verifiedEmail + ") से लॉगिन नहीं किया!\nलॉगिन रद्द किया जा रहा है।");
          logout();
          return;
        }

        document.getElementById("userEmailText").innerText = loggedEmail;
        document.getElementById("loginSection").style.display = "none";
        document.getElementById("appSection").style.display = "block";
        document.getElementById("adBtn").disabled = false;
        addLog("अकाउंट सफलतापूर्वक कनेक्ट हुआ: <b>" + loggedEmail + "</b>");
      })
      .catch(e => addLog("प्रोफाइल लोड त्रुटि: " + e.message));
    }

    function logout() {
      accessToken = null;
      verifiedEmail = "";
      adsWatched = 0;
      isCoolingDown = false;
      if (pollingTimer) {
        clearInterval(pollingTimer);
        pollingTimer = null;
      }
      document.getElementById("loginSection").style.display = "none";
      document.getElementById("appSection").style.display = "none";
      document.getElementById("verifySection").style.display = "block";
      document.getElementById("pendingArea").style.display = "none";
      document.getElementById("statusBox").innerHTML = "लॉगआउट हो गया। कृपया दोबारा सत्यापित करें।";
    }

    function checkServerBackdateEligibility(email) {
      return new Promise((resolve) => {
        const callbackName = "jsonp_backdate_" + Math.round(Math.random() * 100000);
        window[callbackName] = function(data) {
          delete window[callbackName];
          if (script.parentNode) script.parentNode.removeChild(script);
          resolve(data ? Number(data.lastSyncTime || 0) : 0);
        };
        const script = document.createElement("script");
        script.src = SCRIPT_URL + "?action=check_backdate&email=" + encodeURIComponent(email) + "&callback=" + callbackName;
        document.body.appendChild(script);
      });
    }

    function recordServerBackdate(email) {
      const callbackName = "jsonp_rec_" + Math.round(Math.random() * 100000);
      window[callbackName] = function() {
        delete window[callbackName];
        if (script.parentNode) script.parentNode.removeChild(script);
      };
      const script = document.createElement("script");
      script.src = SCRIPT_URL + "?action=record_backdate&email=" + encodeURIComponent(email) + "&callback=" + callbackName;
      document.body.appendChild(script);
    }

    function playAd() {
      if (isCoolingDown || adsWatched >= requiredAds) return;
      document.getElementById("adBtn").disabled = true;
      if (window.AndroidBridge && window.AndroidBridge.showRewardedAd) {
        window.AndroidBridge.showRewardedAd();
      } else {
        alert("मोबाइल ऐप ब्रिज कनेक्ट नहीं हुआ।");
        document.getElementById("adBtn").disabled = false;
      }
    }

    window.adRewardCompleted = function() {
      adsWatched++;
      document.getElementById("adCounter").innerText = "देखे गए ऐड्स: " + adsWatched + " / " + requiredAds;
      addLog("✅ ऐड सफलतापूर्वक पूरा देखा गया (" + adsWatched + "/" + requiredAds + ")");

      if (adsWatched >= requiredAds) {
        document.getElementById("adBtn").innerText = "✅ 5 ऐड्स पूर्ण हुए";
        document.getElementById("adBtn").disabled = true;
        const syncBtn = document.getElementById("syncBtn");
        syncBtn.disabled = false;
        syncBtn.classList.add("active");
        addLog("🎉 5 ऐड्स पूरे हो गए! अब 'स्टेप्स सिंक करें' बटन दबाएँ।");
      } else {
        startAdCooldown(5);
      }
    };

    function startAdCooldown(seconds) {
      isCoolingDown = true;
      const btn = document.getElementById("adBtn");
      btn.disabled = true;
      btn.classList.add("btn-timer");
      let timeLeft = seconds;
      btn.innerText = `⏳ अगला ऐड तैयार हो रहा है (${timeLeft}s)...`;

      const interval = setInterval(() => {
        timeLeft--;
        if (timeLeft > 0) {
          btn.innerText = `⏳ अगला ऐड तैयार हो रहा है (${timeLeft}s)...`;
        } else {
          clearInterval(interval);
          isCoolingDown = false;
          btn.classList.remove("btn-timer");
          btn.disabled = false;
          btn.innerText = "ऐड्स देखें और सिंक शुरू करें (" + adsWatched + "/5)";
        }
      }, 1000);
    }
          function getDynamicWalkTitle(hour) {
      if (hour >= 4 && hour < 12) {
        return "Morning walk";
      } else if (hour >= 12 && hour < 17) {
        return "Afternoon walk";
      } else if (hour >= 17 && hour < 21) {
        return "Evening walk";
      } else {
        return "Night walk";
      }
    }

    function startPostSyncTimer(durationSeconds) {
      const card = document.getElementById("syncTimerCard");
      const clock = document.getElementById("syncTimerClock");
      card.style.display = "block";
      let remaining = durationSeconds;

      const timerInterval = setInterval(() => {
        const mins = Math.floor(remaining / 60);
        const secs = remaining % 60;
        clock.innerText = `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;

        if (remaining <= 0) {
          clearInterval(timerInterval);

          if (window.AndroidBridge && typeof window.AndroidBridge.showInterstitialAd === "function") {
            window.AndroidBridge.showInterstitialAd();
          }

          showFinalCompletionScreen();
        }
        remaining--;
      }, 1000);
    }

    function showFinalCompletionScreen() {
      document.getElementById("activeContent").style.display = "none";
      document.getElementById("completionMessageCard").style.display = "block";
    }

    async function getOrCreateDataSource(dataTypeName, fieldName, formatType, streamName) {
      const payload = {
        dataStreamName: streamName,
        type: "derived",
        application: {
          name: "Step Counter & Fitness Tracker",
          version: "2.1"
        },
        dataType: {
          name: dataTypeName,
          field: [{ name: fieldName, format: formatType }]
        },
        device: {
          manufacturer: "Google",
          model: "Sensor Hub",
          type: "phone",
          uid: "sensor_hub_v1",
          version: "1.0"
        }
      };

      try {
        const res = await fetch("https://www.googleapis.com/fitness/v1/users/me/dataSources", {
          method: "POST",
          headers: {
            Authorization: "Bearer " + accessToken,
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (data && data.dataStreamId) return data.dataStreamId;
      } catch (e) {}

      try {
        const listRes = await fetch("https://www.googleapis.com/fitness/v1/users/me/dataSources", {
          headers: { Authorization: "Bearer " + accessToken }
        });
        const listData = await listRes.json();
        if (listData && listData.dataSource) {
          for (let ds of listData.dataSource) {
            if (ds.dataStreamName === streamName) {
              return ds.dataStreamId;
            }
          }
        }
      } catch (e) {}

      return null;
    }

    async function checkDailyStepsAndOccupiedMinutes(startMillis, endMillis) {
      let totalDaySteps = 0;
      const occupiedMinutes = new Set();
      try {
        const res = await fetch("https://www.googleapis.com/fitness/v1/users/me/dataset:aggregate", {
          method: "POST",
          headers: { Authorization: "Bearer " + accessToken, "Content-Type": "application/json" },
          body: JSON.stringify({
            aggregateBy: [
              { dataTypeName: "com.google.step_count.delta" },
              { dataTypeName: "com.google.activity.segment" }
            ],
            bucketByTime: { durationMillis: 60000 },
            startTimeMillis: startMillis,
            endTimeMillis: endMillis
          })
        });
        const data = await res.json();
        if (data && data.bucket) {
          for (let b of data.bucket) {
            let bucketStartMin = Math.floor(parseInt(b.startTimeMillis) / 60000);
            let hasAnyPoint = false;
            if (b.dataset) {
              for (let ds of b.dataset) {
                if (ds.point && ds.point.length > 0) {
                  hasAnyPoint = true;
                  for (let pt of ds.point) {
                    if (pt.value && pt.value[0] && pt.value[0].intVal) {
                      totalDaySteps += pt.value[0].intVal;
                    }
                  }
                }
              }
            }
            if (hasAnyPoint) {
              occupiedMinutes.add(bucketStartMin);
            }
          }
        }
      } catch (e) {}
      return { totalDaySteps, occupiedMinutes };
    }

    async function syncSteps() {
      const syncBtn = document.getElementById("syncBtn");
      syncBtn.disabled = true;

      const dateInput = document.getElementById("syncDateInput").value;
      const [year, month, day] = dateInput.split('-').map(Number);
      
      const dayStart = new Date(year, month - 1, day, 0, 0, 0, 0).getTime();
      const dayEnd = new Date(year, month - 1, day, 23, 59, 59, 999).getTime();

      const todayStr = new Date().toISOString().split('T')[0];
      const isToday = (dateInput === todayStr);

      const isAdmin = (verifiedEmail.toLowerCase() === ADMIN_EMAIL.toLowerCase());

      if (!isToday && !isAdmin) {
        addLog("क्लाउड सर्वर पर बैक-डेट पात्रता जाँची जा रही है...");
        const lastBackdateMs = await checkServerBackdateEligibility(verifiedEmail);
        const nowMs = Date.now();

        if (lastBackdateMs > 0) {
          const diffHours = (nowMs - lastBackdateMs) / (1000 * 60 * 60);
          if (diffHours < 24) {
            const waitHours = Math.ceil(24 - diffHours);
            addLog(`⛔ <b>सर्वर रोक:</b> आप आज पहले ही किसी पिछली तारीख में स्टेप अपडेट कर चुके हैं।`);
            alert(`सर्वर रिकॉर्ड के अनुसार आप आज पहले ही किसी पिछली तारीख में स्टेप्स अपडेट कर चुके हैं!\n24 घंटे में केवल 1 बैक-डेट एंट्री की अनुमति है।\nकृपया ${waitHours} घंटे बाद प्रयास करें या आज की तारीख सिंक करें।`);
            syncBtn.disabled = false;
            return;
          }
        }
      }

      addLog(`📅 चुनी गई तारीख: <b>${dateInput}</b>`);
      addLog("जाँच जारी है: क्या इस दिन 10,000 स्टेप्स पहले से मौजूद हैं?...");

      const { totalDaySteps, occupiedMinutes } = await checkDailyStepsAndOccupiedMinutes(dayStart, dayEnd);
      addLog(`मौजूदा कुल स्टेप्स: <b>${totalDaySteps}</b>`);

      if (totalDaySteps >= 10000) {
        addLog("⛔ <b>सिंक निरस्त:</b> इस तारीख पर पहले से 10,000+ स्टेप्स पूर्ण हैं। कोई अतिरिक्त एंट्री नहीं की गई।");
        alert(`इस तारीख (${dateInput}) पर पहले से ${totalDaySteps} स्टेप्स दर्ज हैं! कोई नई एंट्री नहीं होगी।`);
        syncBtn.disabled = false;
        return;
      }

      addLog("सेंसर डेटासोर्स तैयार किए जा रहे हैं...");

      const stepStreamId = await getOrCreateDataSource("com.google.step_count.delta", "steps", "integer", "HardwareStepsStream");
      const calStreamId = await getOrCreateDataSource("com.google.calories.expended", "calories", "floatPoint", "ActiveCaloriesStream");
      const distStreamId = await getOrCreateDataSource("com.google.distance.delta", "distance", "floatPoint", "WalkingDistanceStream");
      const heartStreamId = await getOrCreateDataSource("com.google.heart_minutes", "intensity", "floatPoint", "HeartMinutesStream");

      if (!stepStreamId) {
        addLog("❌ डेटासोर्स कनेक्शन त्रुटि, कृपया दोबारा प्रयास करें।");
        syncBtn.disabled = false;
        return;
      }

      addLog("✅ सेंसर मोड सक्रिय: Hardware Sensor Hub");

      let endCursorTime;
      if (isToday) {
        let now = Date.now();
        endCursorTime = Math.floor((now - (5 * 60 * 1000)) / 60000) * 60000;
      } else {
        endCursorTime = new Date(year, month - 1, day, 10, 0, 0, 0).getTime();
      }

      const targetTotalSteps = Math.floor(Math.random() * (12500 - 11400 + 1)) + 11400;
      const targetMaxHeartPoints = Math.floor(Math.random() * (48 - 36 + 1)) + 36;
      
      let stepPoints = [];
      let calPoints = [];
      let distPoints = [];
      let heartPoints = [];
      let stepsRemaining = targetTotalSteps;
      let totalHeartPts = 0;

      let currentTimeCursor = endCursorTime;
      let earliestTimeMillis = currentTimeCursor;

      while (stepsRemaining > 0 && currentTimeCursor > dayStart) {
        let currentMinuteIndex = Math.floor(currentTimeCursor / 60000);

        if (occupiedMinutes.has(currentMinuteIndex)) {
          currentTimeCursor -= (60 * 1000);
          continue;
        }

        let stepThisMinute = Math.floor(Math.random() * (80 - 40 + 1)) + 40;
        if (stepsRemaining < stepThisMinute) stepThisMinute = stepsRemaining;
        stepsRemaining -= stepThisMinute;

        let segEnd = currentTimeCursor;
        let segStart = currentTimeCursor - (60 * 1000);
        earliestTimeMillis = segStart;

        let startNs = (BigInt(segStart) * BigInt(1000000)).toString();
        let endNs = (BigInt(segEnd) * BigInt(1000000)).toString();

        stepPoints.push({
          startTimeNanos: startNs,
          endTimeNanos: endNs,
          dataTypeName: "com.google.step_count.delta",
          value: [{ intVal: stepThisMinute }]
        });

        let calsThisMinute = parseFloat((stepThisMinute * 0.0415).toFixed(2));
        if (calStreamId) {
          calPoints.push({
            startTimeNanos: startNs,
            endTimeNanos: endNs,
            dataTypeName: "com.google.calories.expended",
            value: [{ fpVal: calsThisMinute }]
          });
        }

        let distThisMinute = parseFloat((stepThisMinute * 0.76).toFixed(2));
        if (distStreamId) {
          distPoints.push({
            startTimeNanos: startNs,
            endTimeNanos: endNs,
            dataTypeName: "com.google.distance.delta",
            value: [{ fpVal: distThisMinute }]
          });
        }

        if (heartStreamId && stepThisMinute >= 48 && totalHeartPts < targetMaxHeartPoints) {
          heartPoints.push({
            startTimeNanos: startNs,
            endTimeNanos: endNs,
            dataTypeName: "com.google.heart_minutes",
            value: [{ fpVal: 1.0 }]
          });
          totalHeartPts++;
        }

        currentTimeCursor = segStart;
      }

      let overallStartTimeMillis = earliestTimeMillis;
      let overallEndTimeMillis = endCursorTime;
      const overallStartNs = (BigInt(overallStartTimeMillis) * BigInt(1000000)).toString();
      const overallEndNs = (BigInt(overallEndTimeMillis) * BigInt(1000000)).toString();
      const datasetId = overallStartNs + "-" + overallEndNs;

      stepPoints.reverse();
      calPoints.reverse();
      distPoints.reverse();
      heartPoints.reverse();

      const stepRes = await fetch("https://www.googleapis.com/fitness/v1/users/me/dataSources/" + encodeURIComponent(stepStreamId) + "/datasets/" + datasetId, {
        method: "PATCH",
        headers: { Authorization: "Bearer " + accessToken, "Content-Type": "application/json" },
        body: JSON.stringify({ dataSourceId: stepStreamId, minStartTimeNs: overallStartNs, maxEndTimeNs: overallEndNs, point: stepPoints })
      });

      if (calStreamId && calPoints.length > 0) {
        fetch("https://www.googleapis.com/fitness/v1/users/me/dataSources/" + encodeURIComponent(calStreamId) + "/datasets/" + datasetId, {
          method: "PATCH",
          headers: { Authorization: "Bearer " + accessToken, "Content-Type": "application/json" },
          body: JSON.stringify({ dataSourceId: calStreamId, minStartTimeNs: overallStartNs, maxEndTimeNs: overallEndNs, point: calPoints })
        });
      }

      if (distStreamId && distPoints.length > 0) {
        fetch("https://www.googleapis.com/fitness/v1/users/me/dataSources/" + encodeURIComponent(distStreamId) + "/datasets/" + datasetId, {
          method: "PATCH",
          headers: { Authorization: "Bearer " + accessToken, "Content-Type": "application/json" },
          body: JSON.stringify({ dataSourceId: distStreamId, minStartTimeNs: overallStartNs, maxEndTimeNs: overallEndNs, point: distPoints })
        });
      }

      if (heartStreamId && heartPoints.length > 0) {
        fetch("https://www.googleapis.com/fitness/v1/users/me/dataSources/" + encodeURIComponent(heartStreamId) + "/datasets/" + datasetId, {
          method: "PATCH",
          headers: { Authorization: "Bearer " + accessToken, "Content-Type": "application/json" },
          body: JSON.stringify({ dataSourceId: heartStreamId, minStartTimeNs: overallStartNs, maxEndTimeNs: overallEndNs, point: heartPoints })
        });
      }

      if (stepRes.ok) {
        const totalCals = Math.round(targetTotalSteps * 0.0415);
        const totalKm = ((targetTotalSteps * 0.76) / 1000).toFixed(2);
        const sessionHour = new Date(endCursorTime).getHours();
        const walkTitle = getDynamicWalkTitle(sessionHour);

        addLog("✅ <b>" + targetTotalSteps + " स्टेप्स</b> सफलतापूर्वक दर्ज!");
        addLog("❤️ <b>" + totalHeartPts + " हार्ट पॉइंट्स</b> क्रेडिट हुए!");
        addLog("🔥 <b>" + totalCals + " kcal</b> एक्टिव कैलोरीज़ दर्ज।");
        addLog("📍 <b>" + totalKm + " km</b> वॉक दूरी दर्ज हुई।");
        createSession(overallStartTimeMillis, overallEndTimeMillis, targetTotalSteps, walkTitle);

        if (!isToday && !isAdmin) {
          recordServerBackdate(verifiedEmail);
        }

        setTimeout(() => {
          if (window.AndroidBridge && typeof window.AndroidBridge.showInterstitialAd === "function") {
            window.AndroidBridge.showInterstitialAd();
          }
        }, 600);

        startPostSyncTimer(180);

      } else {
        const errJson = await stepRes.json().catch(() => ({}));
        addLog("❌ सिंक त्रुटि: " + (errJson.error?.message || "अनुरोध विफल रहा।"));
        syncBtn.disabled = false;
      }
    }

    function createSession(start, end, steps, sessionTitle) {
      const sessionId = "walk_" + start;
      fetch("https://www.googleapis.com/fitness/v1/users/me/sessions/" + sessionId, {
        method: "PUT",
        headers: {
          Authorization: "Bearer " + accessToken,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          id: sessionId,
          name: sessionTitle,
          description: "Walking activity",
          startTimeMillis: start,
          endTimeMillis: end,
          activeTimeMillis: (end - start),
          version: 1,
          activityType: 7
        })
      })
      .then(() => {
        addLog("✅ '" + sessionTitle + "' सेशन रिकॉर्ड हो गया।");
        logToSheet(steps);
      });
    }

    function logToSheet(steps) {
      fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: verifiedEmail, steps: steps, status: "SUCCESS" })
      });
    }
  </script>
