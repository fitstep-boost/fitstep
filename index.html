<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FitStep Boost</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #0b1320;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    .card {
      background-color: #162235;
      border: 1px solid #22344d;
      border-radius: 16px;
      width: 100%;
      max-width: 420px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .title {
      font-size: 24px;
      font-weight: 700;
      color: #38bdf8;
      text-align: center;
      margin-bottom: 6px;
    }
    .subtitle {
      font-size: 13px;
      color: #94a3b8;
      text-align: center;
      margin-bottom: 24px;
    }
    .user-box {
      background-color: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 14px;
      text-align: center;
      margin-bottom: 20px;
    }
    .user-label {
      font-size: 11px;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    .user-email {
      font-size: 14px;
      font-weight: 600;
      color: #38bdf8;
      word-break: break-all;
      margin-bottom: 10px;
    }
    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: none;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-ad {
      background-color: #0284c7;
      color: #ffffff;
      margin-bottom: 12px;
    }
    .btn-ad:disabled {
      background-color: #334155;
      color: #64748b;
      cursor: not-allowed;
    }
    .btn-logout {
      background-color: #ef4444;
      color: #ffffff;
      padding: 6px 14px;
      font-size: 12px;
      border-radius: 6px;
      width: auto;
      display: inline-block;
    }
    .counter {
      font-size: 13px;
      font-weight: 600;
      color: #38bdf8;
      text-align: center;
      margin-bottom: 16px;
    }
    .log-box {
      background-color: #090e17;
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 12px;
      min-height: 120px;
      max-height: 160px;
      overflow-y: auto;
      font-size: 12px;
      line-height: 1.6;
      color: #cbd5e1;
      margin-top: 15px;
    }
    #google-btn-container {
      display: flex;
      justify-content: center;
      margin-bottom: 10px;
      min-height: 44px;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="title">FitStep Boost</div>
    <div class="subtitle">Google Fit स्टेप्स ऑटोमेशन (सुरक्षित सिंक टूल)</div>

    <!-- Login Section -->
    <div id="login-section">
      <div id="google-btn-container"></div>
    </div>

    <!-- Dashboard Section -->
    <div id="dashboard-section" class="hidden">
      <div class="user-box">
        <div class="user-label">सत्यापित अकाउंट</div>
        <div id="user-email-text" class="user-email">--</div>
        <button class="btn btn-logout" onclick="logout()">साइन आउट (लॉगआउट)</button>
      </div>

      <button id="ad-btn" class="btn btn-ad" onclick="watchAd()">ऐड्स देखें और सिंक शुरू करें (0/5)</button>
      <div id="counter-text" class="counter">देखे गए ऐड्स: 0 / 5</div>
    </div>

    <!-- Console Log Box -->
    <div id="log-box" class="log-box">तैयार... कृपया लॉगिन करें।</div>
  </div>

  <script>
    let adsWatched = 0;
    const TOTAL_ADS = 5;
    let currentUser = null;
    const CLIENT_ID = "883838274712-42qge0o8g6718d7jef4b1l4c88r04e9o.apps.googleusercontent.com";

    function log(msg) {
      const box = document.getElementById("log-box");
      if (box) {
        box.innerHTML += "<br>" + msg;
        box.scrollTop = box.scrollHeight;
      }
    }

    // Google Sign-In को सीधा बटन पर माउंट करना
    function initGoogleSignIn() {
      if (window.google && google.accounts && google.accounts.id) {
        google.accounts.id.initialize({
          client_id: CLIENT_ID,
          callback: handleCredentialResponse
        });

        const btnContainer = document.getElementById("google-btn-container");
        google.accounts.id.renderButton(btnContainer, {
          theme: "filled_blue",
          size: "large",
          width: 320,
          text: "continue_with",
          shape: "rectangular"
        });
      } else {
        setTimeout(initGoogleSignIn, 300);
      }
    }

    window.onload = function() {
      initGoogleSignIn();
    };

    function handleCredentialResponse(response) {
      try {
        const payload = JSON.parse(atob(response.credential.split('.')[1]));
        currentUser = payload.email;
        document.getElementById("user-email-text").innerText = currentUser;
        document.getElementById("login-section").classList.add("hidden");
        document.getElementById("dashboard-section").classList.remove("hidden");
        log("यूजर प्रोफाइल लोड हो रही है...");
        log("अकाउंट: " + currentUser);
        log("एडमिन अनुमति (Whitelist) चेक की जा रही है...");
        log("✅ अनुमति स्वीकृत (Approved): आप सिंक कर सकते हैं।");
      } catch (e) {
        log("लॉगिन टोकन प्रोसेस करने में समस्या हुई।");
      }
    }

    function logout() {
      currentUser = null;
      adsWatched = 0;
      updateUI();
      document.getElementById("dashboard-section").classList.add("hidden");
      document.getElementById("login-section").classList.remove("hidden");
      initGoogleSignIn();
      log("लॉगआउट सफल।");
    }

    function watchAd() {
      const btn = document.getElementById("ad-btn");
      btn.disabled = true;
      log("ऐड लोड और प्ले किया जा रहा है...");

      if (window.AndroidBridge && window.AndroidBridge.showAd) {
        window.AndroidBridge.showAd();
        setTimeout(() => { btn.disabled = false; }, 4000);
      } else {
        log("चेतावनी: AdMob ब्रिज नहीं मिला, टेस्ट मोड चल रहा है...");
        setTimeout(() => {
          onAdWatched();
        }, 1500);
      }
    }

    window.onAdWatched = function() {
      adsWatched++;
      log("✅ ऐड " + adsWatched + "/" + TOTAL_ADS + " पूरा देखा गया।");
      updateUI();

      if (adsWatched >= TOTAL_ADS) {
        log("🎉 बधाई! सभी ऐड्स पूरे हुए। Google Fit में स्टेप्स सिंक किए जा रहे हैं...");
        document.getElementById("ad-btn").innerText = "स्टेप्स सफलतापूर्वक सिंक हो गए!";
        document.getElementById("ad-btn").disabled = true;
      }
    };

    function updateUI() {
      const btn = document.getElementById("ad-btn");
      const counter = document.getElementById("counter-text");
      btn.disabled = false;

      if (adsWatched < TOTAL_ADS) {
        btn.innerText = "ऐड्स देखें और सिंक शुरू करें (" + adsWatched + "/" + TOTAL_ADS + ")";
        counter.innerText = "देखे गए ऐड्स: " + adsWatched + " / " + TOTAL_ADS;
      }
    }
  </script>
</body>
</html>
