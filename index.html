<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitStep Boost</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0b1120;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
    }
    .card {
      background: #1e293b;
      border-radius: 20px;
      width: 100%;
      max-width: 420px;
      padding: 26px 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      text-align: center;
    }
    h1 { font-size: 24px; font-weight: 700; margin-bottom: 6px; color: #38bdf8; }
    p.sub { font-size: 13px; color: #94a3b8; margin-bottom: 22px; }
    .user-box {
      background: #0f172a;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 18px;
      font-size: 13px;
      word-break: break-all;
    }
    .user-label { color: #94a3b8; font-size: 12px; margin-bottom: 4px; }
    .user-email { color: #38bdf8; font-weight: 600; font-size: 14px; margin-bottom: 10px; }
    .btn-row {
      display: flex;
      gap: 8px;
      justify-content: center;
    }
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 12px;
      transition: all 0.2s;
    }
    .btn-login { background: #0284c7; color: #fff; }
    .btn-ad { background: #0284c7; color: #fff; }
    .btn-sync { background: #1e3a5f; color: #64748b; }
    .btn-sync.active { background: #16a34a; color: #fff; }
    .btn-logout { background: #ef4444; color: #fff; padding: 7px 14px; font-size: 12px; border-radius: 8px; width: auto; }
    .btn-refresh { background: #0284c7; color: #fff; padding: 7px 14px; font-size: 12px; border-radius: 8px; width: auto; }
    .btn:disabled { background: #1e293b; border: 1px solid #334155; color: #475569; cursor: not-allowed; }
    .ad-counter-text { font-size: 13px; color: #38bdf8; margin-bottom: 16px; font-weight: 500; }
    .status-text {
      background: #0f172a;
      border-radius: 12px;
      padding: 14px;
      font-size: 12px;
      color: #94a3b8;
      text-align: left;
      line-height: 1.7;
      margin-top: 14px;
      max-height: 170px;
      overflow-y: auto;
    }
    .status-text b { color: #38bdf8; }
  </style>
</head>
<body>

  <div class="card">
    <h1>FitStep Boost</h1>
    <p class="sub">Google Fit स्टेप्स ऑटोमेशन (सुरक्षित सिंक टूल)</p>

    <div id="loginSection">
      <button id="loginBtn" class="btn btn-login" onclick="login()">Google Fit से लॉगिन करें</button>
    </div>

    <div id="appSection" style="display: none;">
      <div class="user-box">
        <div class="user-label">लॉगिन अकाउंट</div>
        <div id="userEmailText" class="user-email"></div>
        <div class="btn-row">
          <button class="btn btn-refresh" onclick="verifyWhitelist(userEmail)">स्थिति रिफ्रेश करें 🔄</button>
          <button class="btn btn-logout" onclick="logout()">साइन आउट (लॉगआउट)</button>
        </div>
      </div>

      <button id="adBtn" class="btn btn-ad" onclick="playAd()" disabled>ऐड्स देखें और सिंक शुरू करें (0/5)</button>
      <div id="adCounter" class="ad-counter-text">देखे गए ऐड्स: 0 / 5</div>
      <button id="syncBtn" class="btn btn-sync" onclick="syncSteps()" disabled>स्टेप्स सिंक करें</button>
    </div>

    <div id="statusBox" class="status-text">तैयार... कृपया लॉगिन करें।</div>
  </div>

  <script>
    const APP_VERSION = "1.0";
    const CLIENT_ID = "198753021000-di6e8eklooh5bbo34f002b5c3b1a3958.apps.googleusercontent.com";
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx0af3er7Y8i5yNBBUdKfaos15Z9METmiYl05acKw3cPeUE2j7nHkN02m-dPxXYm_1_/exec";

    let tokenClient;
    let accessToken = null;
    let userEmail = "";
    let adsWatched = 0;
    const requiredAds = 5;

    function addLog(msg) {
      const box = document.getElementById("statusBox");
      box.innerHTML += "<br>" + msg;
      box.scrollTop = box.scrollHeight;
    }

    window.onload = function() {
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: "https://www.googleapis.com/auth/fitness.activity.write https://www.googleapis.com/auth/userinfo.email openid",
        callback: (tokenResponse) => {
          if (tokenResponse && tokenResponse.access_token) {
            accessToken = tokenResponse.access_token;
            fetchEmail();
          }
        }
      });
    };

    function login() {
      addLog("Google लॉगिन खोला जा रहा है...");
      tokenClient.requestAccessToken({ prompt: "select_account" });
    }

    function logout() {
      accessToken = null;
      userEmail = "";
      adsWatched = 0;
      document.getElementById("loginSection").style.display = "block";
      document.getElementById("appSection").style.display = "none";
      document.getElementById("statusBox").innerHTML = "लॉगआउट हो गया। कृपया दोबारा लॉगिन करें।";
    }

    function fetchEmail() {
      addLog("यूज़र प्रोफाइल लोड हो रही है...");
      fetch("https://www.googleapis.com/oauth2/v2/userinfo", {
        headers: { Authorization: "Bearer " + accessToken }
      })
      .then(r => r.json())
      .then(info => {
        userEmail = info.email;
        document.getElementById("userEmailText").innerText = userEmail;
        document.getElementById("loginSection").style.display = "none";
        document.getElementById("appSection").style.display = "block";
        addLog("अकाउंट: <b>" + userEmail + "</b>");
        verifyWhitelist(userEmail);
      })
      .catch(e => addLog("प्रोफाइल लोड त्रुटि: " + e.message));
    }

    function verifyWhitelist(email) {
      addLog("एडमिन अनुमति (Whitelist) जाँची जा रही है...");
      const callbackName = "jsonp_cb_" + Math.round(Math.random() * 100000);
      window[callbackName] = function(data) {
        delete window[callbackName];
        if (script.parentNode) script.parentNode.removeChild(script);

        if (data.allowed) {
          addLog("✅ अनुमति स्वीकृत (Approved): आप सिंक कर सकते हैं।");
          document.getElementById("adBtn").disabled = false;
        } else if (data.status === "OUTDATED_VERSION") {
          addLog("❌ <b>ऐप वर्ज़न पुराना है:</b> नया वर्ज़न उपलब्ध है।");
          alert("आपका ऐप वर्ज़न पुराना हो चुका है! कृपया एडमिन से नया APK लेकर अपडेट करें।");
        } else {
          addLog("⏳ अनुमति लंबित (Pending): एडमिन की मंज़ूरी का इंतज़ार करें।");
        }
      };

      const script = document.createElement("script");
      script.src = SCRIPT_URL + "?email=" + encodeURIComponent(email) + "&version=" + APP_VERSION + "&callback=" + callbackName;
      document.body.appendChild(script);
    }

    function playAd() {
      if (window.AndroidBridge && window.AndroidBridge.showRewardedAd) {
        window.AndroidBridge.showRewardedAd();
      } else {
        alert("मोबाइल ऐप ब्रिज कनेक्ट नहीं हुआ।");
      }
    }

    window.adRewardCompleted = function() {
      adsWatched++;
      document.getElementById("adBtn").innerText = "ऐड्स देखें और सिंक शुरू करें (" + adsWatched + "/5)";
      document.getElementById("adCounter").innerText = "देखे गए ऐड्स: " + adsWatched + " / " + requiredAds;
      addLog("ऐड सफलतापूर्वक देखा गया (" + adsWatched + "/" + requiredAds + ")");

      if (adsWatched >= requiredAds) {
        document.getElementById("adBtn").disabled = true;
        const syncBtn = document.getElementById("syncBtn");
        syncBtn.disabled = false;
        syncBtn.classList.add("active");
        addLog("🎉 5 ऐड्स पूरे हो गए! अब 'स्टेप्स सिंक करें' बटन दबाएँ।");
      }
    };

    async function ensureDataSource() {
      const payload = {
        dataStreamName: "FitStepDelta",
        type: "raw",
        application: {
          name: "FitStep Boost",
          version: "1.0"
        },
        dataType: {
          name: "com.google.step_count.delta",
          field: [{ name: "steps", format: "integer" }]
        }
      };

      try {
        const res = await fetch("https://www.googleapis.com/fitness/v1/users/me/dataSources", {
          method: "POST",
          headers: {
            Authorization: "Bearer " + accessToken,
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (data && data.dataStreamId) {
          return data.dataStreamId;
        }
      } catch (e) {
        console.error("DataSource check exception:", e);
      }

      return "raw:com.google.step_count.delta:com.google.android.gms:estimated_steps";
    }

    async function syncSteps() {
      document.getElementById("syncBtn").disabled = true;
      addLog("Google Fit डेटासोर्स तैयार किया जा रहा है...");

      const activeStreamId = await ensureDataSource();

      addLog("स्टेप्स को प्राकृतिक वॉक में विभाजित किया जा रहा है...");
      
      const targetTotalSteps = Math.floor(Math.random() * (12500 - 11200 + 1)) + 11200;
      const now = Date.now();
      
      // वॉक को पिछले 2.5 घंटों में 12 अंतरालों में विभाजित किया जाता है
      const numSegments = 12;
      const segmentDurationMillis = 10 * 60 * 1000; // प्रत्येक सेशन 10 मिनट
      const gapMillis = 2 * 60 * 1000;              // 2 मिनट का अंतराल
      const totalSpanMillis = (numSegments * (segmentDurationMillis + gapMillis));
      
      let overallStartTimeMillis = now - totalSpanMillis - (10 * 60 * 1000);
      let points = [];
      let stepsRemaining = targetTotalSteps;

      for (let i = 0; i < numSegments; i++) {
        let segStart = overallStartTimeMillis + (i * (segmentDurationMillis + gapMillis));
        let segEnd = segStart + segmentDurationMillis;

        let segSteps;
        if (i === numSegments - 1) {
          segSteps = stepsRemaining;
        } else {
          segSteps = Math.floor(stepsRemaining / (numSegments - i)) + Math.floor(Math.random() * 60 - 30);
        }
        stepsRemaining -= segSteps;

        let startNs = BigInt(segStart) * BigInt(1000000);
        let endNs = BigInt(segEnd) * BigInt(1000000);

        points.push({
          startTimeNanos: startNs.toString(),
          endTimeNanos: endNs.toString(),
          dataTypeName: "com.google.step_count.delta",
          value: [{ intVal: segSteps }]
        });
      }

      const overallStartNs = BigInt(overallStartTimeMillis) * BigInt(1000000);
      const overallEndNs = BigInt(now - (10 * 60 * 1000)) * BigInt(1000000);
      const datasetId = overallStartNs.toString() + "-" + overallEndNs.toString();

      const payload = {
        dataSourceId: activeStreamId,
        minStartTimeNs: overallStartNs.toString(),
        maxEndTimeNs: overallEndNs.toString(),
        point: points
      };

      fetch("https://www.googleapis.com/fitness/v1/users/me/dataSources/" + encodeURIComponent(activeStreamId) + "/datasets/" + datasetId, {
        method: "PATCH",
        headers: {
          Authorization: "Bearer " + accessToken,
          "Content-Type": "application/json"
        },
        body: JSON.stringify(payload)
      })
      .then(res => {
        if (res.ok) {
          addLog("✅ " + targetTotalSteps + " स्टेप्स प्राकृतिक रूप से सिंक हो गए!");
          createSession(overallStartTimeMillis, now - (10 * 60 * 1000), targetTotalSteps);
        } else {
          res.json().then(errData => {
            if (errData && errData.error && errData.error.message) {
              addLog("सिंक त्रुटि: " + errData.error.message);
            } else {
              addLog("सिंक त्रुटि: API अनुरोध विफल रहा।");
            }
          }).catch(() => {
            addLog("सिंक त्रुटि: API अनुरोध विफल रहा।");
          });
          document.getElementById("syncBtn").disabled = false;
        }
      })
      .catch(e => {
        addLog("नेटवर्क त्रुटि: " + e.message);
        document.getElementById("syncBtn").disabled = false;
      });
    }

    function createSession(start, end, steps) {
      const sessionId = "fitstep_" + start;
      fetch("https://www.googleapis.com/fitness/v1/users/me/sessions/" + sessionId, {
        method: "PUT",
        headers: {
          Authorization: "Bearer " + accessToken,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          id: sessionId,
          name: "Brisk Walk",
          description: "FitStep Boost Session",
          startTimeMillis: start,
          endTimeMillis: end,
          version: 1,
          activityType: 7
        })
      })
      .then(() => {
        addLog("✅ वॉक सेशन रिकॉर्ड हो गया।");
        logToSheet(steps);
      });
    }

    function logToSheet(steps) {
      fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: userEmail, steps: steps, status: "SUCCESS" })
      });
    }
  </script>
</body>
</html>
