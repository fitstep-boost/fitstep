<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitStep Boost</title>
  <script src="https://accounts.google.com/gsi/client"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0b1120;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
    }
    .card {
      background: #1e293b;
      border-radius: 20px;
      width: 100%;
      max-width: 420px;
      padding: 26px 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      text-align: center;
    }
    h1 { font-size: 24px; font-weight: 700; margin-bottom: 6px; color: #38bdf8; }
    p.sub { font-size: 13px; color: #94a3b8; margin-bottom: 22px; }
    .user-box {
      background: #0f172a;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 18px;
      font-size: 13px;
      word-break: break-all;
    }
    .user-label { color: #94a3b8; font-size: 12px; margin-bottom: 4px; }
    .user-email { color: #38bdf8; font-weight: 600; font-size: 14px; margin-bottom: 10px; }
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 12px;
      transition: all 0.2s;
    }
    .btn-login { background: #0284c7; color: #fff; }
    .btn-ad { background: #0284c7; color: #fff; }
    .btn-sync { background: #1e3a5f; color: #64748b; }
    .btn-sync.active { background: #16a34a; color: #fff; }
    .btn-logout { background: #ef4444; color: #fff; padding: 7px 18px; font-size: 12px; border-radius: 8px; width: auto; }
    .btn:disabled { background: #1e293b; border: 1px solid #334155; color: #475569; cursor: not-allowed; }
    .ad-counter-text { font-size: 13px; color: #38bdf8; margin-bottom: 16px; font-weight: 500; }
    .status-text {
      background: #0f172a;
      border-radius: 12px;
      padding: 14px;
      font-size: 12px;
      color: #94a3b8;
      text-align: left;
      line-height: 1.7;
      margin-top: 14px;
      max-height: 170px;
      overflow-y: auto;
    }
    .status-text b { color: #38bdf8; }
    .done-banner {
      background: #14532d;
      border: 1px solid #22c55e;
      color: #86efac;
      padding: 12px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 14px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>FitStep Boost</h1>
    <p class="sub">Google Fit स्टेप्स ऑटोमेशन (सुरक्षित सिंक टूल)</p>

    <div id="loginSection">
      <button id="loginBtn" class="btn btn-login" onclick="login()">Google Fit से लॉगिन करें</button>
    </div>

    <div id="appSection" style="display: none;">
      <div class="user-box">
        <div class="user-label">लॉगिन अकाउंट</div>
        <div id="userEmailText" class="user-email"></div>
        <button class="btn btn-logout" onclick="logout()">साइन आउट (लॉगआउट)</button>
      </div>

      <div id="doneBanner" class="done-banner">
        ✅ <b>आज का कोटा पूरा हुआ!</b><br>आप आज के स्टेप्स सिंक कर चुके हैं। अगला मौका आज रात
