
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitStep Boost</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; padding: 24px 16px; background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    .card { background: #1e293b; border-radius: 16px; padding: 24px; width: 100%; max-width: 420px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); text-align: center; }
    h1 { font-size: 24px; margin-bottom: 8px; color: #38bdf8; }
    p { font-size: 14px; color: #94a3b8; line-height: 1.5; }
    .btn { background: #0284c7; color: white; border: none; padding: 14px 20px; border-radius: 10px; font-size: 16px; font-weight: 600; width: 100%; cursor: pointer; margin-top: 14px; transition: background 0.2s; }
    .btn:hover { background: #0369a1; }
    .btn:disabled { background: #475569; cursor: not-allowed; }
    .btn-logout { background: #dc2626; padding: 8px 14px; font-size: 13px; border-radius: 8px; margin-top: 8px; width: auto; display: inline-block; }
    .btn-logout:hover { background: #b91c1c; }
    .user-badge { background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 10px 14px; margin: 12px 0; text-align: left; }
    .user-email { color: #38bdf8; font-weight: 600; font-size: 14px; word-break: break-all; }
    .status-box { margin-top: 20px; background: #0f172a; border-radius: 10px; padding: 16px; text-align: left; font-size: 13px; color: #cbd5e1; min-height: 130px; max-height: 220px; overflow-y: auto; white-space: pre-wrap; word-break: break-all; }
    .counter { font-size: 15px; font-weight: 600; color: #38bdf8; margin-top: 14px; }
  </style>
</head>
<body>

  <div class="card">
    <h1>FitStep Boost</h1>
    <p>Google Fit स्टेप्स ऑटोमेशन (DeFit स्मार्ट सिंक)</p>

    <div id="authSection">
      <button class="btn" id="loginBtn" onclick="requestToken()">Google Fit से कनेक्ट करें</button>
    </div>

    <div id="appSection" style="display: none;">
      <div class="user-badge">
        <div style="font-size: 11px; color: #94a3b8; text-transform: uppercase;">सक्रिय अकाउंट:</div>
        <div class="user-email" id="displayEmail">लोड हो रहा है...</div>
        <button class="btn btn-logout" onclick="logout()">साइन आउट (Logout)</button>
      </div>
      
      <button class="btn" id="syncBtn" onclick="startSyncProcess()">ऐड्स देखें और सिंक शुरू करें (0/5)</button>
      <div class="counter" id="adCounter">देखे गए ऐड्स: 0 / 5</div>
    </div>

    <div class="status-box" id="statusLog">तैयार... कृपया लॉगिन करें।</div>
  </div>

  <script>
    const CLIENT_ID = "198753021000-di6e8eklooh5bbo34f002b5c3b1a3958.apps.googleusercontent.com";
    const SCOPES = "https://www.googleapis.com/auth/fitness.activity.write email profile openid";
    
    let tokenClient;
    let accessToken = localStorage.getItem("fit_token") || null;
    let userEmail = localStorage.getItem("fit_email") || null;
    let adsWatched = 0;

    function log(msg) {
      const box = document.getElementById("statusLog");
      box.textContent += "\n" + msg;
      box.scrollTop = box.scrollHeight;
    }

    window.onload = function() {
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: SCOPES,
        callback: async (resp) => {
          if (resp.error) {
            log("लॉगिन त्रुटि: " + resp.error);
            return;
          }
          accessToken = resp.access_token;
          localStorage.setItem("fit_token", accessToken);
          await fetchUserProfile();
        },
      });

      if (accessToken) {
        if (userEmail) {
          showAppInterface(userEmail);
        } else {
          fetchUserProfile();
        }
      }
    };

    async function fetchUserProfile() {
      try {
        const res = await fetch("https://www.googleapis.com/oauth2/v3/userinfo", {
          headers: { "Authorization": `Bearer ${accessToken}` }
        });
        if (res.ok) {
          const profile = await res.json();
          userEmail = profile.email || "अज्ञात ईमेल";
          localStorage.setItem("fit_email", userEmail);
          showAppInterface(userEmail);
        } else {
          logout();
        }
      } catch (e) {
        logout();
      }
    }

    function showAppInterface(email) {
      document.getElementById("authSection").style.display = "none";
      document.getElementById("appSection").style.display = "block";
      document.getElementById("displayEmail").innerText = email;
      log("सफलतापूर्वक कनेक्टेड: " + email);
    }

    function requestToken() {
      tokenClient.requestAccessToken({ prompt: "select_account" });
    }

    function logout() {
      if (accessToken) {
        google.accounts.oauth2.revoke(accessToken, () => {
          console.log("Token revoked");
        });
      }
      localStorage.removeItem("fit_token");
      localStorage.removeItem("fit_email");
      accessToken = null;
      userEmail = null;
      adsWatched = 0;

      document.getElementById("authSection").style.display = "block";
      document.getElementById("appSection").style.display = "none";
      document.getElementById("statusLog").textContent = "तैयार... कृपया लॉगिन करें।";
      log("अकाउंट साइन आउट हो गया है। अब नए अकाउंट से लॉगिन कर सकते हैं।");
    }

    function startSyncProcess() {
      if (window.AndroidBridge && window.AndroidBridge.showRewardedAd) {
        window.AndroidBridge.showRewardedAd();
      } else {
        adRewardCompleted();
      }
    }

    function adRewardCompleted() {
      adsWatched++;
      document.getElementById("adCounter").innerText = `देखे गए ऐड्स: ${adsWatched} / 5`;
      document.getElementById("syncBtn").innerText = `ऐड्स देखें और सिंक शुरू करें (${adsWatched}/5)`;
      log(`ऐड ${adsWatched}/5 पूरा देखा गया।`);

      if (adsWatched >= 5) {
        document.getElementById("syncBtn").disabled = true;
        log("5 ऐड्स पूरे हुए! स्मार्ट बैकग्राउंड डिस्ट्रीब्यूशन शुरू...");
        runDeFitStyleSync();
      }
    }

    async function getValidDataSource() {
      const listRes = await fetch("https://www.googleapis.com/fitness/v1/users/me/dataSources?dataTypeName=com.google.step_count.delta", {
        headers: { "Authorization": `Bearer ${accessToken}` }
      });

      if (listRes.ok) {
        const listData = await listRes.json();
        if (listData.dataSource && listData.dataSource.length > 0) {
          return listData.dataSource[0].dataStreamId;
        }
      }

      const createRes = await fetch("https://www.googleapis.com/fitness/v1/users/me/dataSources", {
        method: "POST",
        headers: {
          "Authorization": `Bearer ${accessToken}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          "dataStreamName": "DefaultStepCounter",
          "type": "raw",
          "application": { "name": "FitStepBoost" },
          "dataType": {
            "name": "com.google.step_count.delta",
            "field": [{ "name": "steps", "format": "integer" }]
          }
        })
      });

      const createData = await createRes.json();
      return createData.dataStreamId;
    }

    async function runDeFitStyleSync() {
      try {
        log("डेटासोर्स कनेक्ट किया जा रहा है...");
        const dataSourceId = await getValidDataSource();

        const targetSteps = Math.floor(Math.random() * (12500 - 11200 + 1)) + 11200;
        const totalMinutes = Math.floor(targetSteps / 95);

        const nowMs = Date.now();
        const startSessionMs = nowMs - (totalMinutes * 60 * 1000);

        log(`सत्र: पिछले ${totalMinutes} मिनट (~2 घंटे) में स्वाभाविक वॉक का निर्माण...`);
        log(`गति: 70 से 115 स्टेप्स प्रति मिनट`);

        let points = [];
        let accumulated = 0;

        for (let i = 0; i < totalMinutes; i++) {
          const mStart = startSessionMs + (i * 60 * 1000);
          const mEnd = mStart + (60 * 1000);

          let minSteps = Math.floor(Math.random() * (115 - 70 + 1)) + 70;

          if (i === totalMinutes - 1) {
            minSteps = Math.max(50, targetSteps - accumulated);
          }
          accumulated += minSteps;

          const pStartNanos = (BigInt(mStart) * 1000000n).toString();
          const pEndNanos = (BigInt(mEnd) * 1000000n).toString();

          points.push({
            "startTimeNanos": pStartNanos,
            "endTimeNanos": pEndNanos,
            "dataTypeName": "com.google.step_count.delta",
            "value": [{ "intVal": minSteps }]
          });

          if (accumulated >= targetSteps) break;
        }

        const totalStartNanos = (BigInt(startSessionMs) * 1000000n).toString();
        const totalEndNanos = (BigInt(nowMs) * 1000000n).toString();

        log(`कुल सिंक स्टेप्स: ${accumulated}`);

        const datasetRequestBody = {
          "dataSourceId": dataSourceId,
          "minStartTimeNs": totalStartNanos,
          "maxEndTimeNs": totalEndNanos,
          "point": points
        };

        const datasetId = `${totalStartNanos}-${totalEndNanos}`;
        const apiUrl = `https://www.googleapis.com/fitness/v1/users/me/dataSources/${encodeURIComponent(dataSourceId)}/datasets/${datasetId}`;

        const res = await fetch(apiUrl, {
          method: "PATCH",
          headers: {
            "Authorization": `Bearer ${accessToken}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify(datasetRequestBody)
        });

        if (!res.ok) {
          const err = await res.json();
          log("डेटासेट सिंक त्रुटि: " + JSON.stringify(err));
          return;
        }

        const sessionId = "FitStep_Walk_" + startSessionMs;
        const sessionPayload = {
          "id": sessionId,
          "name": "Brisk Walking",
          "description": "Natural Outdoor Walking",
          "startTimeMillis": startSessionMs,
          "endTimeMillis": nowMs,
          "activityType": 7,
          "application": { "name": "FitStepBoost" }
        };

        await fetch(`https://www.googleapis.com/fitness/v1/users/me/sessions/${sessionId}`, {
          method: "PUT",
          headers: {
            "Authorization": `Bearer ${accessToken}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify(sessionPayload)
        });

        log(`\n🎉 सफलता! ${accumulated} स्टेप्स प्राकृतिक वॉक सेशन के साथ सिंक हो गए हैं।`);
        log("👉 अब आप ब्राउज़र बंद कर सकते हैं।");

      } catch (e) {
        log("त्रुटि: " + e.message);
      }
    }
  </script>
</body>
</html>
